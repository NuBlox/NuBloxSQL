name: NuBloxSQL Security

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: '23 3 * * 1'
  workflow_dispatch:

permissions:
  contents: read
  security-events: write

jobs:
  proprietary-and-fuzz:
    name: Proprietary boundary and protocol fuzz
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Assert zero third-party package boundary
        run: npm run v1:proprietary-audit
      - name: Fuzz canonical MySQL packet framing
        env:
          NUBLOX_FUZZ_ITERATIONS: 10000
          NUBLOX_FUZZ_MAX_PAYLOAD: 2048
        run: node test/security/fuzz-parser-boundaries.js
      - name: Verify canonical package contracts
        run: npm run verify

  codeql:
    name: CodeQL JavaScript/TypeScript
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: javascript-typescript
          queries: security-extended
      - name: Analyze
        uses: github/codeql-action/analyze@v4
        with:
          category: '/language:javascript-typescript'
