name: NuBloxSQL MySQL

on:
  push:
    branches: [main]
    paths:
      - 'index.js'
      - 'index.d.ts'
      - 'package.json'
      - 'lib/client/**'
      - 'test/client-api.js'
      - 'test/client-live.js'
      - 'test/client-types-live.js'
      - 'test/client-transaction-live.js'
      - 'test/client-operation-live.js'
      - 'test/operation-control.js'
      - 'lib/dialects/mysql/**'
      - '.github/workflows/mysql-cleanroom.yml'
  pull_request:
    paths:
      - 'index.js'
      - 'index.d.ts'
      - 'package.json'
      - 'lib/client/**'
      - 'test/client-api.js'
      - 'test/client-live.js'
      - 'test/client-types-live.js'
      - 'test/client-transaction-live.js'
      - 'test/client-operation-live.js'
      - 'test/operation-control.js'
      - 'lib/dialects/mysql/**'
      - '.github/workflows/mysql-cleanroom.yml'

permissions:
  contents: read

jobs:
  contract:
    name: MySQL contracts (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24, 26]
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
      - name: Verify MySQL runtime contracts
        run: npm run test:mysql

  live:
    name: live MySQL ${{ matrix.mysql }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        mysql: ['8.4', '9.7']
    services:
      mysql:
        image: mysql:${{ matrix.mysql }}
        env:
          MYSQL_ROOT_PASSWORD: nublox_root_password
          MYSQL_DATABASE: nublox_ci
          MYSQL_USER: nublox
          MYSQL_PASSWORD: nublox_ci_password
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h localhost -uroot -pnublox_root_password --silent"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=30
    env:
      NUBLOX_DIALECT: mysql
      MYSQL_HOST: 127.0.0.1
      MYSQL_PORT: 3306
      MYSQL_USER: nublox
      MYSQL_PASSWORD: nublox_ci_password
      MYSQL_ROOT_PASSWORD: nublox_root_password
      MYSQL_DATABASE: nublox_ci
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Unified NuBloxSQL client contract
        run: node test/client-live.js
      - name: Portable type codec contract
        run: node test/client-types-live.js
      - name: Advanced transaction contract
        run: node test/client-transaction-live.js
      - name: Portable operation control contract
        run: node test/client-operation-live.js
      - name: Direct streaming with backpressure
        run: node lib/dialects/mysql/test/live-streaming.js direct
      - name: Pooled streaming reuse
        run: node lib/dialects/mysql/test/live-streaming.js pool
      - name: Result-limit connection safety
        run: node lib/dialects/mysql/test/live-streaming.js limits
      - name: Deadline and cancellation safety
        run: node lib/dialects/mysql/test/live-operation-control.js
      - name: Secure LOAD DATA LOCAL INFILE qualification
        run: node lib/dialects/mysql/test/live-local-infile.js
      - name: Full MySQL connection, prepared, transaction and pool smoke
        run: node lib/dialects/mysql/test/live.js
