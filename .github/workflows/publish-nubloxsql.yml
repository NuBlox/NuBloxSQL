name: Publish NuBloxSQL

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    name: Publish nubloxsql
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"
          package-manager-cache: false

      - name: Use trusted-publishing-capable npm
        run: npm install --global npm@^11.15.0

      - name: Verify release tag and main ancestry
        shell: bash
        run: |
          VERSION="$(node -p "require('./package.json').version")"
          test "${GITHUB_REF_NAME}" = "v${VERSION}"
          git fetch origin main --depth=1
          git merge-base --is-ancestor "${GITHUB_SHA}" origin/main

      - name: Run complete release gate
        run: npm run release:check

      - name: Check registry state
        id: registry
        shell: bash
        run: |
          VERSION="$(node -p "require('./package.json').version")"
          if npm view "nubloxsql@${VERSION}" version --registry=https://registry.npmjs.org >/dev/null 2>&1; then
            echo "already_published=true" >> "${GITHUB_OUTPUT}"
            echo "nubloxsql@${VERSION} is already published; verifying the tag without republishing."
          else
            echo "already_published=false" >> "${GITHUB_OUTPUT}"
          fi

      - name: Publish with semantic dist-tag
        if: steps.registry.outputs.already_published != 'true'
        shell: bash
        run: |
          VERSION="$(node -p "require('./package.json').version")"
          if [[ "${VERSION}" == *-* ]]; then
            DIST_TAG=next
          else
            DIST_TAG=latest
          fi
          npm publish --access public --tag "${DIST_TAG}"

      - name: Verify published version
        shell: bash
        run: |
          VERSION="$(node -p "require('./package.json').version")"
          PUBLISHED="$(npm view "nubloxsql@${VERSION}" version --registry=https://registry.npmjs.org)"
          test "${PUBLISHED}" = "${VERSION}"
