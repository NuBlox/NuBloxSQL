name: NuBloxSQL MongoDB Native

on:
  pull_request:
    paths:
      - 'index.js'
      - 'index.d.ts'
      - 'package.json'
      - 'lib/runtime/**'
      - 'lib/dialects/mongodb/**'
      - 'lib/catalog/DatabaseTechnologyRegistry.js'
      - 'types/native.d.ts'
      - 'types/database-technology.d.ts'
      - 'test/database-technology-foundation.js'
      - '.github/workflows/mongodb-native.yml'
  push:
    branches: [main]
    paths:
      - 'index.js'
      - 'index.d.ts'
      - 'package.json'
      - 'lib/runtime/**'
      - 'lib/dialects/mongodb/**'
      - 'lib/catalog/DatabaseTechnologyRegistry.js'
      - 'types/native.d.ts'
      - 'types/database-technology.d.ts'
      - 'test/database-technology-foundation.js'
      - '.github/workflows/mongodb-native.yml'

permissions:
  contents: read

jobs:
  contract:
    name: MongoDB native contracts (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24, 26]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
      - run: npm run test:mongodb

  live:
    name: live MongoDB ${{ matrix.mongodb }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        mongodb: ['7.0', '8.0']
    services:
      mongodb:
        image: mongo:${{ matrix.mongodb }}
        ports:
          - 27017:27017
        options: >-
          --health-cmd="mongosh --quiet --eval 'db.adminCommand({ping:1}).ok' | grep -q 1"
          --health-interval=5s
          --health-timeout=10s
          --health-retries=30
    env:
      MONGODB_HOST: 127.0.0.1
      MONGODB_PORT: 27017
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Install official MongoDB Node driver (separate, CI-only dependency)
        run: npm install --no-save --no-package-lock --ignore-scripts --no-audit --no-fund mongodb@7
      - name: Exercise live native document operations
        run: node lib/dialects/mongodb/test/live.js

  authenticated:
    name: live MongoDB 8.0 SCRAM authentication
    runs-on: ubuntu-latest
    services:
      mongodb:
        image: mongo:8.0
        env:
          MONGO_INITDB_ROOT_USERNAME: nublox_ci
          MONGO_INITDB_ROOT_PASSWORD: ephemeral_only_mongodb_ci_password
        ports:
          - 27017:27017
        options: >-
          --health-cmd="mongosh --quiet --eval 'db.adminCommand({ping:1}).ok' | grep -q 1"
          --health-interval=5s
          --health-timeout=10s
          --health-retries=30
    env:
      MONGODB_HOST: 127.0.0.1
      MONGODB_PORT: 27017
      MONGODB_USERNAME: nublox_ci
      MONGODB_PASSWORD: ephemeral_only_mongodb_ci_password
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Install official MongoDB driver only in ephemeral test environment
        run: npm install --no-save --no-package-lock --ignore-scripts --no-audit --no-fund mongodb@7
      - name: Verify real SCRAM login, rejected bad credentials and CRUD
        run: node lib/dialects/mongodb/test/live.js

  replica:
    name: live MongoDB 8.0 replica-set discovery
    runs-on: ubuntu-latest
    env:
      MONGODB_HOST: 127.0.0.1
      MONGODB_PORT: 27017
      MONGODB_REPLICA_SET: nubloxrs
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Launch ephemeral local replica-set member
        shell: bash
        run: |
          docker run -d --name nublox-mongo-rs --network host mongo:8.0             --replSet nubloxrs --bind_ip_all
          for i in $(seq 1 45); do
            if docker exec nublox-mongo-rs mongosh --quiet               --eval 'db.adminCommand({ping:1}).ok' | grep -q 1; then
              break
            fi
            sleep 2
          done
          docker exec nublox-mongo-rs mongosh --quiet --eval             "rs.initiate({_id:'nubloxrs',members:[{_id:0,host:'127.0.0.1:27017'}]})"
          ready=0
          for i in $(seq 1 45); do
            if docker exec nublox-mongo-rs mongosh --quiet               --eval 'db.hello().isWritablePrimary' | grep -q true; then
              ready=1
              break
            fi
            sleep 2
          done
          test "$ready" -eq 1
      - name: Install official MongoDB driver only in ephemeral test environment
        run: npm install --no-save --no-package-lock --ignore-scripts --no-audit --no-fund mongodb@7
      - name: Verify replica-set identity, discovery and native CRUD
        run: node lib/dialects/mongodb/test/live.js
      - name: Stop ephemeral replica-set member
        if: always()
        run: docker rm -f nublox-mongo-rs || true

  failover:
    name: live MongoDB 8.0 three-member failover
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      NUBLOX_EPHEMERAL_MONGO_FAILOVER: three-node-ci
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Start isolated three-member replica set
        shell: bash
        run: |
          set -euo pipefail
          for number in 1 2 3; do
            port=$((27016 + number))
            docker run -d --name "nublox-mongo-failover-$number" \
              --network host mongo:8.0 \
              --replSet nubloxrs --bind_ip_all --port "$port" \
              --wiredTigerCacheSizeGB 0.25
          done
          ready=0
          for attempt in $(seq 1 60); do
            if docker exec nublox-mongo-failover-1 mongosh --quiet \
              --host 127.0.0.1 --port 27017 \
              --eval 'db.adminCommand({ping:1}).ok' 2>/dev/null | grep -qx 1; then
              ready=1
              break
            fi
            sleep 2
          done
          test "$ready" -eq 1
          docker exec nublox-mongo-failover-1 mongosh --quiet \
            --host 127.0.0.1 --port 27017 \
            --eval "rs.initiate({_id:'nubloxrs',members:[{_id:0,host:'127.0.0.1:27017'},{_id:1,host:'127.0.0.1:27018'},{_id:2,host:'127.0.0.1:27019'}]})"
          secondaries_ready=0
          for attempt in $(seq 1 90); do
            states=$(docker exec nublox-mongo-failover-1 mongosh --quiet \
              --host 127.0.0.1 --port 27017 \
              --eval "rs.status().members.filter(m => m.stateStr === 'SECONDARY').length" 2>/dev/null || true)
            if [ "$states" = 2 ]; then
              secondaries_ready=1
              break
            fi
            sleep 2
          done
          test "$secondaries_ready" -eq 1
      - name: Install optional official MongoDB driver in ephemeral CI
        run: npm install --no-save --no-package-lock --ignore-scripts --no-audit --no-fund mongodb@7
      - name: Stop elected primary and verify native client recovery
        run: node lib/dialects/mongodb/test/failover.js
      - name: Destroy ephemeral database nodes
        if: always()
        run: |
          for number in 1 2 3; do
            docker rm -f "nublox-mongo-failover-$number" 2>/dev/null || true
          done
