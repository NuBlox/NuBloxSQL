name: Build and live PostgreSQL slice

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  driver-shell:
    name: Node 24 — Driver and Shell
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17@sha256:2d2b8998d31037bf721cfdf764d76ba74171b4fab3431b7f72c27c56ddbdf9e3
        env:
          POSTGRES_PASSWORD: ci-fixture-admin-only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install pinned npm workspace dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Enforce first-party native database runtime
        shell: bash
        run: |
          node --input-type=module -e "import fs from 'node:fs'; const root=JSON.parse(fs.readFileSync('package.json')); const driver=JSON.parse(fs.readFileSync('packages/driver/package.json')); const lock=JSON.parse(fs.readFileSync('package-lock.json')); if (Object.keys(driver.dependencies ?? {}).length || root.devDependencies?.['@types/pg'] || Object.keys(lock.packages).some(p => /node_modules\/(pg|@types\/pg|mysql2|tedious|mongodb|redis)$/.test(p))) process.exit(1)"
      - name: Build strict TypeScript Driver and Shell
        run: npm run build
      - name: Test contracts, boundaries and CLI
        run: npm run check:structure && node --test tests/unit/*.test.mjs
      - name: Launch disposable PostgreSQL TLS fixture
        shell: bash
        run: bash tests/fixtures/postgresql/start-tls.sh
      - name: Live PostgreSQL TLS certificate and downgrade protection
        env:
          NUBLOXSQL_CI_ADMIN_PASSWORD: ci-fixture-admin-only
        run: node --test tests/integration/postgresql/verified-tls.test.mjs
      - name: Stop disposable PostgreSQL TLS fixture
        if: always()
        shell: bash
        run: docker rm -f nubloxsql-pg-verified-tls nubloxsql-pg-wrong-name || true
      - name: Live PostgreSQL 17 discovery and privilege filtering
        env:
          NUBLOXSQL_CI_ADMIN_PASSWORD: ci-fixture-admin-only
        run: node --test tests/integration/postgresql/inventory.test.mjs tests/integration/postgresql/resource-governance.test.mjs
