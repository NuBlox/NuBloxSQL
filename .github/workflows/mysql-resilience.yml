name: MySQL repeated outage and long-duration resilience qualification

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      hours:
        description: 'Manual uninterrupted soak duration (hours)'
        type: choice
        required: true
        default: '2'
        options: ['1', '2']
  schedule:
    - cron: '11 1 * * 6'

permissions:
  contents: read

jobs:
  repeated-outages:
    name: mysql-repeated-outages
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      mysql:
        image: mysql:8.4.13
        env:
          MYSQL_ROOT_PASSWORD: test-password
          MYSQL_DATABASE: nublox_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -u root --password=test-password"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=40
    env:
      NUBLOX_LIVE_MYSQL: '1'
      MYSQL_USER: root
      MYSQL_PASSWORD: test-password
      MYSQL_DATABASE: nublox_test
      NUBLOX_QUALIFICATION_MYSQL_VERSION: '8.4.13'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Build native driver
        run: |
          npm ci --no-audit --no-fund
          npm run build
      - name: Install multi-result SQL procedure fixtures
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t containers < <(docker ps -q --filter 'ancestor=mysql:8.4.13')
          test "${#containers[@]}" -eq 1
          docker exec -i -e MYSQL_PWD=test-password "${containers[0]}" mysql --protocol=tcp -h127.0.0.1 -uroot nublox_test < packages/driver/tests/fixtures/multi-results.sql
      - name: Validate resilience policy and complete ordinary driver regressions
        run: |
          node --test tools/qualification/outage-evidence.test.mjs
          npm test
      - name: Repeat destructive fixture outage, queued pool saturation and recovery
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t containers < <(docker ps -q --filter 'ancestor=mysql:8.4.13')
          test "${#containers[@]}" -eq 1
          export NUBLOX_QUALIFICATION_CONTAINER="${containers[0]}"
          export NUBLOX_ALLOW_DESTRUCTIVE_MYSQL_FIXTURE=1
          if [[ "${{ github.event_name }}" == schedule ||
                "${{ github.event_name }}" == workflow_dispatch ]]; then
            cycles=6
          else
            cycles=2
          fi
          node tools/qualification/repeated-outages.mjs --cycles="$cycles"
      - name: Retain every crash cycle and pool resource evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mysql-repeated-outages-${{ github.run_id }}
          path: artifacts/qualification/*.json
          if-no-files-found: error
          retention-days: 30

  long-soak:
    name: mysql-extended-soak
    if: ${{ github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    timeout-minutes: 140
    services:
      mysql:
        image: mysql:8.4.13
        env:
          MYSQL_ROOT_PASSWORD: test-password
          MYSQL_DATABASE: nublox_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -u root --password=test-password"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=40
    env:
      NUBLOX_LIVE_MYSQL: '1'
      MYSQL_USER: root
      MYSQL_PASSWORD: test-password
      MYSQL_DATABASE: nublox_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Compile native driver
        run: npm ci --no-audit --no-fund
      - name: Sustained pooled reads and SQL error recovery without early iteration cutoff
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${{ github.event_name }}" == workflow_dispatch ]]; then
            duration_ms=$(( ${{ inputs.hours || '2' }} * 3600000 ))
          else
            duration_ms=1800000
          fi
          npm run soak:mysql -- --durationMs="$duration_ms" --iterations=100000000 --concurrency=4
      - name: Retain extended resource, heap and elapsed-duration evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mysql-extended-soak-${{ github.run_id }}
          path: artifacts/qualification/*.json
          if-no-files-found: error
          retention-days: 60

  repeated-outage-evidence:
    name: mysql-repeated-outage-evidence
    if: ${{ always() }}
    needs: [repeated-outages]
    runs-on: ubuntu-latest
    timeout-minutes: 6
    env:
      NUBLOX_QUALIFICATION_MYSQL_VERSION: '8.4.13'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Require passed destructive-outage qualification
        run: test "${{ needs.repeated-outages.result }}" = success
      - name: Download each separately preserved crash cycle
        uses: actions/download-artifact@v4
        with:
          name: mysql-repeated-outages-${{ github.run_id }}
          path: artifacts/repeated-evidence
      - name: Validate strict evidence and replay-rejection policy
        run: |
          node --test tools/qualification/outage-evidence.test.mjs tools/qualification/verify-outage-bundle.test.mjs
          node tools/qualification/verify-outage-bundle.mjs artifacts/repeated-evidence
      - name: Retain an independently validated resilience decision
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mysql-repeated-outage-decision-${{ github.run_id }}
          path: artifacts/qualification-matrix/*.json
          if-no-files-found: warn
          retention-days: 30

  extended-soak-evidence:
    name: mysql-extended-soak-evidence
    if: ${{ always() && (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') }}
    needs: [long-soak]
    runs-on: ubuntu-latest
    timeout-minutes: 6
    permissions:
      contents: read
    env:
      NUBLOX_ENDURANCE_HOURS: ${{ inputs.hours || '0' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Require a successful full-duration native soak
        run: test "${{ needs.long-soak.result }}" = success
      - name: Download only the retained extended-soak report
        uses: actions/download-artifact@v4
        with:
          name: mysql-extended-soak-${{ github.run_id }}
          path: artifacts/extended-soak-evidence
      - name: Reject incomplete, stale, forged or resource-leaking endurance evidence
        run: |
          node --test tools/qualification/extended-soak-evidence.test.mjs
          node tools/qualification/verify-extended-soak-evidence.mjs artifacts/extended-soak-evidence
      - name: Retain independent sustained-reliability decision
        uses: actions/upload-artifact@v4
        with:
          name: mysql-extended-soak-decision-${{ github.run_id }}
          path: artifacts/qualification-matrix/mysql-extended-soak-evidence-*.json
          if-no-files-found: error
          retention-days: 60

  mixed-workloads:
    name: mysql-mixed-workloads
    runs-on: ubuntu-latest
    timeout-minutes: 22
    services:
      mysql:
        image: mysql:8.4.13
        env:
          MYSQL_ROOT_PASSWORD: test-password
          MYSQL_DATABASE: nublox_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -u root --password=test-password"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=40
    env:
      NUBLOX_LIVE_MYSQL: '1'
      MYSQL_USER: root
      MYSQL_PASSWORD: test-password
      MYSQL_DATABASE: nublox_test
      NUBLOX_QUALIFICATION_MYSQL_VERSION: '8.4.13'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install the reviewed driver toolchain
        run: npm ci --no-audit --no-fund
      - name: Build and test the mixed-workload qualification contract
        run: |
          npm run build
          node --test tools/qualification/mixed-workloads.test.mjs
      - name: Exercise pooled query, prepared, cursor, transaction and rollback phases
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${{ github.event_name }}" == schedule ||
                "${{ github.event_name }}" == workflow_dispatch ]]; then
            duration_ms=600000
          else
            duration_ms=8000
          fi
          node tools/qualification/run-mixed.mjs --durationMs="$duration_ms" \
            --maxOperations=1000000 --concurrency=4
      - name: Retain mixed-workload and memory-phase evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mysql-mixed-workloads-${{ github.run_id }}
          path: artifacts/qualification/mixed-workload-*.json
          if-no-files-found: error
          retention-days: 60

  transaction-reconciliation:
    name: mysql-transaction-reconciliation
    runs-on: ubuntu-latest
    timeout-minutes: 12
    services:
      mysql:
        image: mysql:8.4.13
        env:
          MYSQL_ROOT_PASSWORD: test-password
          MYSQL_DATABASE: nublox_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -u root --password=test-password"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=40
    env:
      NUBLOX_LIVE_MYSQL: '1'
      MYSQL_USER: root
      MYSQL_PASSWORD: test-password
      MYSQL_DATABASE: nublox_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install reproducible dependencies and compile native Driver
        run: |
          npm ci --no-audit --no-fund
          npm run build
      - name: Qualify committed versus unsent COMMIT without automatic SQL replay
        run: node --test packages/driver/tests/mysql-transaction-reconciliation-live.test.mjs

  commit-server-crash:
    name: mysql-commit-server-crash
    runs-on: ubuntu-latest
    timeout-minutes: 12
    services:
      mysql:
        image: mysql:8.4.13
        env:
          MYSQL_ROOT_PASSWORD: test-password
          MYSQL_DATABASE: nublox_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -u root --password=test-password"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=40
    env:
      NUBLOX_LIVE_MYSQL: '1'
      MYSQL_USER: root
      MYSQL_PASSWORD: test-password
      MYSQL_DATABASE: nublox_test
      NUBLOX_QUALIFICATION_MYSQL_VERSION: '8.4.13'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install locked workspace and native driver
        run: |
          npm ci --no-audit --no-fund
          npm run build
      - name: Reject forged COMMIT-crash qualification evidence
        run: node --test tools/qualification/commit-crash-evidence.test.mjs
      - name: Identify exactly one pinned, disposable Docker service
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t containers < <(docker ps -q --filter 'ancestor=mysql:8.4.13')
          test "${#containers[@]}" -eq 1
          echo "NUBLOX_QUALIFICATION_CONTAINER=${containers[0]}" >> "$GITHUB_ENV"
      - name: Kill the real MySQL server during COMMIT, recover and reconcile without replay
        env:
          NUBLOX_ALLOW_DESTRUCTIVE_MYSQL_FIXTURE: '1'
        run: node tools/qualification/mysql-commit-crash.mjs
      - name: Retain the original COMMIT-crash report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mysql-commit-crash-${{ github.run_id }}
          path: artifacts/qualification/mysql-commit-crash-${{ github.run_id }}.json
          if-no-files-found: error
          retention-days: 60

  commit-server-crash-evidence:
    name: mysql-commit-server-crash-evidence
    if: ${{ always() }}
    needs: [commit-server-crash]
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Require passed destructive server-crash test
        run: test "${{ needs.commit-server-crash.result }}" = success
      - name: Retrieve the original current-run crash report
        uses: actions/download-artifact@v4
        with:
          name: mysql-commit-crash-${{ github.run_id }}
          path: artifacts/commit-crash-source
      - name: Validate pinned server, exactly-once callback, unknown outcome and cleanup
        run: |
          node --test tools/qualification/commit-crash-evidence.test.mjs
          node tools/qualification/verify-commit-crash-evidence.mjs artifacts/commit-crash-source
      - name: Retain a redacted independent crash decision
        uses: actions/upload-artifact@v4
        with:
          name: mysql-commit-crash-decision-${{ github.run_id }}
          path: artifacts/qualification-matrix/mysql-commit-crash-decision-*.json
          if-no-files-found: error
          retention-days: 60

  two-node-cutover:
    name: mysql-two-node-cutover
    runs-on: ubuntu-latest
    timeout-minutes: 12
    services:
      primary:
        image: mysql:8.4.13
        env:
          MYSQL_ROOT_PASSWORD: test-password
          MYSQL_DATABASE: nublox_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -u root --password=test-password"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=40
      standby:
        image: mysql:8.4.13
        env:
          MYSQL_ROOT_PASSWORD: test-password
          MYSQL_DATABASE: nublox_test
        ports:
          - 3307:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -u root --password=test-password"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=40
    env:
      NUBLOX_LIVE_MYSQL: '1'
      NUBLOX_QUALIFICATION_MYSQL_VERSION: '8.4.13'
      MYSQL_USER: root
      MYSQL_PASSWORD: test-password
      MYSQL_DATABASE: nublox_test
      NUBLOX_PRIMARY_PORT: '3306'
      NUBLOX_STANDBY_PORT: '3307'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install the locked workspace and compile
        run: |
          npm ci --no-audit --no-fund
          npm run build
      - name: Run fail-closed unreplicated-cutover policy regressions
        run: node --test tools/qualification/two-node-cutover-evidence.test.mjs
      - name: Authorise only two individually identified disposable MySQL services
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t ids < <(docker ps -q --filter 'ancestor=mysql:8.4.13')
          test "${#ids[@]}" -eq 2
          primary=''
          standby=''
          for id in "${ids[@]}"; do
            ports="$(docker port "$id" 3306/tcp)"
            if grep -q ':3306$' <<< "$ports"; then
              test -z "$primary"
              primary="$id"
            fi
            if grep -q ':3307$' <<< "$ports"; then
              test -z "$standby"
              standby="$id"
            fi
          done
          test -n "$primary" && test -n "$standby" && test "$primary" != "$standby"
          echo "NUBLOX_PRIMARY_CONTAINER=$primary" >> "$GITHUB_ENV"
          echo "NUBLOX_STANDBY_CONTAINER=$standby" >> "$GITHUB_ENV"
      - name: Crash primary, reject unsafe cutover and reconcile after restore
        env:
          NUBLOX_ALLOW_DESTRUCTIVE_MYSQL_FIXTURE: '1'
        run: node tools/qualification/mysql-two-node-cutover.mjs
      - name: Retain original two-node safety report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mysql-two-node-cutover-${{ github.run_id }}
          path: artifacts/qualification/mysql-two-node-cutover-${{ github.run_id }}.json
          if-no-files-found: error
          retention-days: 60

  two-node-cutover-evidence:
    name: mysql-two-node-cutover-evidence
    if: ${{ always() }}
    needs: [two-node-cutover]
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Require passed real primary crash and cutover policy
        run: test "${{ needs.two-node-cutover.result }}" = success
      - name: Download original report from this exact run
        uses: actions/download-artifact@v4
        with:
          name: mysql-two-node-cutover-${{ github.run_id }}
          path: artifacts/two-node-cutover-source
      - name: Independently verify blocked unsafe promotion and no replay
        run: |
          node --test tools/qualification/two-node-cutover-evidence.test.mjs
          node tools/qualification/verify-two-node-cutover.mjs artifacts/two-node-cutover-source
      - name: Retain reduced fail-closed cutover decision
        uses: actions/upload-artifact@v4
        with:
          name: mysql-two-node-cutover-decision-${{ github.run_id }}
          path: artifacts/qualification-matrix/mysql-two-node-cutover-decision-*.json
          if-no-files-found: error
          retention-days: 60

  gtid-fenced-promotion:
    name: mysql-gtid-fenced-promotion
    runs-on: ubuntu-latest
    timeout-minutes: 16
    env:
      NUBLOX_LIVE_MYSQL: '1'
      NUBLOX_QUALIFICATION_MYSQL_VERSION: '8.4.13'
      MYSQL_PASSWORD: test-password
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install locked workspace, compile and reject unsafe promotions
        run: |
          npm ci --no-audit --no-fund
          npm run build
          node --test tools/qualification/gtid-promotion-evidence.test.mjs
      - name: Provision two uniquely identified GTID-enabled MySQL 8.4.13 containers
        shell: bash
        run: |
          set -euo pipefail
          network="nublox-gtid-${{ github.run_id }}"
          docker network create "$network"
          source_id="$(docker run -d \
            --name "nublox-gtid-source-${{ github.run_id }}" \
            --network "$network" --network-alias nublox-gtid-source \
            --label "nublox.qual.run=${{ github.run_id }}" \
            --label nublox.qual.role=source \
            -p 127.0.0.1:3306:3306 \
            -e MYSQL_ROOT_PASSWORD=test-password -e MYSQL_ROOT_HOST=% \
            --health-cmd='mysqladmin ping -h 127.0.0.1 -u root --password=test-password' \
            --health-interval=5s --health-timeout=5s --health-retries=40 \
            mysql:8.4.13 --server-id=101 --gtid-mode=ON \
            --enforce-gtid-consistency=ON --log-bin=mysql-bin --binlog-format=ROW)"
          replica_id="$(docker run -d \
            --name "nublox-gtid-replica-${{ github.run_id }}" \
            --network "$network" --network-alias nublox-gtid-replica \
            --label "nublox.qual.run=${{ github.run_id }}" \
            --label nublox.qual.role=replica \
            -p 127.0.0.1:3307:3306 \
            -e MYSQL_ROOT_PASSWORD=test-password -e MYSQL_ROOT_HOST=% \
            --health-cmd='mysqladmin ping -h 127.0.0.1 -u root --password=test-password' \
            --health-interval=5s --health-timeout=5s --health-retries=40 \
            mysql:8.4.13 --server-id=102 --gtid-mode=ON \
            --enforce-gtid-consistency=ON --log-bin=mysql-bin --binlog-format=ROW \
            --relay-log-recovery=ON)"
          echo "NUBLOX_GTID_NETWORK=$network" >> "$GITHUB_ENV"
          echo "NUBLOX_GTID_SOURCE_CONTAINER=$source_id" >> "$GITHUB_ENV"
          echo "NUBLOX_GTID_REPLICA_CONTAINER=$replica_id" >> "$GITHUB_ENV"
          for id in "$source_id" "$replica_id"; do
            ready=false
            for i in {1..90}; do
              status="$(docker inspect -f '{{.State.Health.Status}}' "$id")"
              if [[ "$status" == healthy ]]; then ready=true; break; fi
              if [[ "$status" == unhealthy ]]; then break; fi
              sleep 2
            done
            test "$ready" = true
          done
      - name: Test actual GTID replication and fenced explicit promotion
        env:
          NUBLOX_ALLOW_DESTRUCTIVE_MYSQL_FIXTURE: '1'
          NUBLOX_TEST_PROMOTION_APPROVAL: '1'
        run: node tools/qualification/mysql-gtid-promotion.mjs
      - name: Remove only test-owned disposable Docker fixtures
        if: always()
        shell: bash
        run: |
          docker rm -f "nublox-gtid-source-${{ github.run_id }}" \
            "nublox-gtid-replica-${{ github.run_id }}" 2>/dev/null || true
          docker network rm "nublox-gtid-${{ github.run_id }}" 2>/dev/null || true
      - name: Retain redacted original GTID replication and promotion report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mysql-gtid-promotion-${{ github.run_id }}
          path: artifacts/qualification/mysql-gtid-promotion-${{ github.run_id }}.json
          if-no-files-found: error
          retention-days: 60

  gtid-fenced-promotion-evidence:
    name: mysql-gtid-fenced-promotion-evidence
    if: ${{ always() }}
    needs: [gtid-fenced-promotion]
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Require passed real GTID replication and source-fenced promotion
        run: test "${{ needs.gtid-fenced-promotion.result }}" = success
      - name: Retrieve exact-run original GTID promotion report
        uses: actions/download-artifact@v4
        with:
          name: mysql-gtid-promotion-${{ github.run_id }}
          path: artifacts/gtid-promotion-original
      - name: Independently reject stale or unsafe promotion evidence
        run: |
          node --test tools/qualification/gtid-promotion-evidence.test.mjs
          node tools/qualification/verify-gtid-promotion.mjs artifacts/gtid-promotion-original
      - name: Retain independently verified test-only promotion decision
        uses: actions/upload-artifact@v4
        with:
          name: mysql-gtid-promotion-decision-${{ github.run_id }}
          path: artifacts/qualification-matrix/mysql-gtid-promotion-decision-*.json
          if-no-files-found: error
          retention-days: 60

  gtid-former-primary-rejoin:
    name: mysql-gtid-former-primary-rejoin
    runs-on: ubuntu-latest
    timeout-minutes: 16
    env:
      NUBLOX_LIVE_MYSQL: '1'
      NUBLOX_QUALIFICATION_MYSQL_VERSION: '8.4.13'
      MYSQL_PASSWORD: test-password
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install locked workspace, compile and reject unsafe promotions
        run: |
          npm ci --no-audit --no-fund
          npm run build
          node --test tools/qualification/gtid-rejoin-evidence.test.mjs
      - name: Provision two uniquely identified GTID-enabled MySQL 8.4.13 containers
        shell: bash
        run: |
          set -euo pipefail
          network="nublox-gtid-${{ github.run_id }}"
          docker network create "$network"
          source_id="$(docker run -d \
            --name "nublox-gtid-source-${{ github.run_id }}" \
            --network "$network" --network-alias nublox-gtid-source \
            --label "nublox.qual.run=${{ github.run_id }}" \
            --label nublox.qual.role=source \
            -p 127.0.0.1:3306:3306 \
            -e MYSQL_ROOT_PASSWORD=test-password -e MYSQL_ROOT_HOST=% \
            --health-cmd='mysqladmin ping -h 127.0.0.1 -u root --password=test-password' \
            --health-interval=5s --health-timeout=5s --health-retries=40 \
            mysql:8.4.13 --server-id=101 --gtid-mode=ON \
            --enforce-gtid-consistency=ON --log-bin=mysql-bin --binlog-format=ROW)"
          replica_id="$(docker run -d \
