name: Immutable archive source assessment

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  archive-reference:
    name: Archived assets — read-only unit assessment
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: current
      - uses: actions/checkout@v4
        with:
          ref: 4ed0e35fbfe71ac110c9ec41cf62ba3355e9d56c
          path: legacy
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Verify immutable archived source identity and dependency truth
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C legacy rev-parse HEAD)" = "4ed0e35fbfe71ac110c9ec41cf62ba3355e9d56c"
          test "$(git -C legacy rev-parse 'HEAD^{tree}')" = "d4cf114ac07cd3128eab645beb6f9721ef62c920"
          grep -Fq "require('mongodb').MongoClient" legacy/lib/dialects/mongodb/lib/Connection.js
      - name: Execute existing archived protocol and engineering unit tests
        shell: bash
        working-directory: legacy
        run: |
          set -euo pipefail
          node lib/dialects/postgresql/test/protocol.js
          node lib/dialects/postgresql/test/contract.js
          node lib/dialects/mysql/test/protocol.js
          node lib/dialects/sqlserver/test/protocol.js
          node lib/dialects/redis/test/protocol.js
          node test/canonical-schema-diff.js
          node test/migration-planner.js
      - name: State assessment boundary
        run: echo "Archive unit tests passed; no current-main live/vendor/security qualification implied."
