name: MySQL durable InnoDB write endurance

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      hours:
        description: 'Disposable MySQL write qualification duration in hours'
        type: choice
        required: true
        default: '1'
        options: ['1', '2']
  schedule:
    - cron: '17 3 * * 0'

permissions:
  contents: read

jobs:
  mysql-write-soak:
    name: mysql-durable-write-soak
    runs-on: ubuntu-latest
    timeout-minutes: 140
    services:
      mysql:
        image: mysql:8.4.13
        env:
          MYSQL_ROOT_PASSWORD: test-password
          MYSQL_DATABASE: nublox_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -u root --password=test-password"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=40
    env:
      NUBLOX_LIVE_MYSQL: '1'
      NUBLOX_ALLOW_WRITE_MYSQL_FIXTURE: '1'
      NUBLOX_QUALIFICATION_MYSQL_VERSION: '8.4.13'
      MYSQL_DATABASE: nublox_test
      MYSQL_PORT: '3306'
      MYSQL_USER: root
      MYSQL_PASSWORD: test-password
      NUBLOX_ENDURANCE_HOURS: ${{ inputs.hours || '0' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install and compile native MySQL driver
        run: |
          npm ci --no-audit --no-fund
          npm run build
      - name: Test write workload and independent evidence policy
        run: |
          node --test tools/qualification/write-soak.test.mjs \
            tools/qualification/write-soak-evidence.test.mjs
      - name: Verify one exact-version disposable MySQL container
        shell: bash
        run: |
          set -euo pipefail
          count="$(docker ps -q --filter ancestor=mysql:8.4.13 | wc -l)"
          test "$count" -eq 1
          container="$(docker ps -q --filter ancestor=mysql:8.4.13)"
          image="$(docker inspect -f '{{.Config.Image}}' "$container")"
          test "$image" = 'mysql:8.4.13'
          actual="$(docker exec -e MYSQL_PWD=test-password "$container" \
            mysql -N -s --protocol=tcp -h127.0.0.1 -uroot -e 'SELECT VERSION()')"
          case "$actual" in
            8.4.13|8.4.13-*) ;;
            *) echo 'Unexpected MySQL version' >&2; exit 1 ;;
          esac
      - name: Verify transactions, persisted counters, rollback, memory and pool closure
        shell: bash
        run: |
          set -euo pipefail
          case "$GITHUB_EVENT_NAME" in
            push|pull_request) duration_ms=10000 ;;
            schedule) duration_ms=1800000 ;;
            workflow_dispatch)
              case "$NUBLOX_ENDURANCE_HOURS" in
                1|2) duration_ms=$(( NUBLOX_ENDURANCE_HOURS * 3600000 )) ;;
                *) exit 1 ;;
              esac ;;
            *) exit 1 ;;
          esac
          node tools/qualification/run-write-soak.mjs \
            --durationMs="$duration_ms" --concurrency=4 \
            --maxTransactions=100000000
      - name: Preserve same-run write evidence, including on failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mysql-write-soak-${{ github.run_id }}
          path: artifacts/qualification/mysql-write-soak-*.json
          if-no-files-found: error
          retention-days: 60

  mysql-write-soak-evidence:
    name: mysql-durable-write-soak-evidence
    if: always()
    needs: [mysql-write-soak]
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      NUBLOX_ENDURANCE_HOURS: ${{ inputs.hours || '0' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Require successful write endurance execution
        run: test "${{ needs.mysql-write-soak.result }}" = success
      - name: Download only this run's original write workload report
        uses: actions/download-artifact@v4
        with:
          name: mysql-write-soak-${{ github.run_id }}
          path: artifacts/write-soak-evidence
      - name: Independently verify duration and committed/rolled-back evidence
        run: |
          node --test tools/qualification/write-soak-evidence.test.mjs
          node tools/qualification/verify-write-soak-evidence.mjs \
            artifacts/write-soak-evidence
      - name: Preserve evidence decision
        uses: actions/upload-artifact@v4
        with:
          name: mysql-write-soak-decision-${{ github.run_id }}
          path: artifacts/qualification-matrix/mysql-write-soak-decision-*.json
          if-no-files-found: error
          retention-days: 60
