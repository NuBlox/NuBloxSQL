name: Reconcile obsolete NuBloxSQL branches

# One-time, pinned cleanup. Ordinary merged feature branches are already
# automatically removed by the repository's delete_branch_on_merge setting.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  reconcile:
    if: github.repository == 'NuBlox/NuBloxSQL' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Archive superseded work and remove only verified obsolete branches
        uses: actions/github-script@v8
        with:
          script: |
            const { owner, repo } = context.repo;
            const expected = [
              {
                name: 'rebase/configuration-change-planning',
                sha: 'c703f1a3457bdfb9b29ecff39370e04d3b78279c',
                kind: 'ancestor'
              },
              {
                name: 'fix/audit-plan-and-migration-integrity',
                sha: '509dc0254880d5675723af48ed5a1e15f8c00485',
                kind: 'superseded',
                closedPr: 295,
                mergedReplacements: [294, 296],
                archiveTag: 'archive/superseded-pr-295-20261013'
              }
            ];
            const main = (await github.rest.repos.getBranch({owner, repo, branch: 'main'})).data;
            const mainSha = main.commit.sha;
            async function branchSha(name) {
              try {
                const response = await github.rest.git.getRef({owner, repo, ref: 'heads/' + name});
                return response.data.object.sha;
              } catch (error) {
                if (error.status === 404) return null;
                throw error;
              }
            }
            for (const candidate of expected) {
              const currentSha = await branchSha(candidate.name);
              if (currentSha === null) {
                core.info(candidate.name + ': already absent');
                continue;
              }
              if (currentSha !== candidate.sha) {
                core.warning(candidate.name + ': changed since the audit; preserving it');
                continue;
              }
              if (candidate.kind === 'ancestor') {
                const ancestry = (await github.rest.repos.compareCommits({
                  owner, repo, base: candidate.sha, head: mainSha
                })).data;
                if (ancestry.behind_by !== 0 || ancestry.ahead_by < 1) {
                  core.warning(candidate.name + ': not a verified ancestor; preserving it');
                  continue;
                }
              } else {
                const oldPr = (await github.rest.pulls.get({
                  owner, repo, pull_number: candidate.closedPr
                })).data;
                if (oldPr.state !== 'closed' || oldPr.merged_at !== null ||
                    oldPr.head.ref !== candidate.name || oldPr.head.sha !== candidate.sha ||
                    !oldPr.body?.includes('Superseded by merged PR #294')) {
                  core.warning(candidate.name + ': closed-PR evidence changed; preserving it');
                  continue;
                }
                let qualified = true;
                for (const number of candidate.mergedReplacements) {
                  const replacement = (await github.rest.pulls.get({
                    owner, repo, pull_number: number
                  })).data;
                  if (!replacement.merged_at || !replacement.merge_commit_sha) {
                    qualified = false;
                    break;
                  }
                  const lineage = (await github.rest.repos.compareCommits({
                    owner, repo, base: replacement.merge_commit_sha, head: mainSha
                  })).data;
                  if (lineage.behind_by !== 0) {
                    qualified = false;
                    break;
                  }
                }
                if (!qualified) {
                  core.warning(candidate.name + ': replacement merge lineage unverified; preserving it');
                  continue;
                }
                // Archive first: a non-merged PR's unique commits remain recoverable.
                const tagRef = 'tags/' + candidate.archiveTag;
                try {
                  const archived = (await github.rest.git.getRef({owner,repo,ref:tagRef})).data;
                  if (archived.object.sha !== candidate.sha) {
                    throw new Error('archive tag exists at an unexpected SHA');
                  }
                } catch (error) {
                  if (error.status !== 404) throw error;
                  await github.rest.git.createRef({
                    owner, repo, ref: 'refs/' + tagRef, sha: candidate.sha
                  });
                }
              }
              // Re-read immediately before deletion to avoid deleting a branch
              // which has acquired new commits during qualification.
              if (await branchSha(candidate.name) !== candidate.sha) {
                core.warning(candidate.name + ': updated during audit; preserving it');
                continue;
              }
              await github.rest.git.deleteRef({owner,repo,ref:'heads/' + candidate.name});
              core.info(candidate.name + ': deleted after verification');
            }
