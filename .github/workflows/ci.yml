name: NuBloxSQL CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    name: Node ${{ matrix.node }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24, 26]
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
      - name: Verify NuBloxSQL runtime and internal modules
        run: npm run verify
      - name: Assert proprietary dependency boundary
        run: npm run v1:proprietary-audit
      - name: Assert single release surface
        run: npm run v1:release-audit
      - name: Verify NuBloxSQL publish surface
        run: npm pack --dry-run
