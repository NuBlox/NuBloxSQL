name: NuBloxSQL CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    name: Node ${{ matrix.node }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24, 26]
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm
          cache-dependency-path: package.json

      - name: Install dependencies
        run: npm install --ignore-scripts

      - name: Load callback and promise entry points
        run: node -e "require('./'); require('./promise');"

      - name: Lint
        run: npm run lint

      - name: Unit tests
        run: npm run test:unit

      - name: Validate compatibility manifest
        run: npm run compatibility:check

      - name: Verify mysql2 API contract
        run: npm run test:compat:mysql2:contract

      - name: Verify publish surface
        run: npm pack --dry-run

  mysql-auth:
    name: MySQL ${{ matrix.mysql }} modern auth and mysql2 parity
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        mysql: ['8.4', '9.7']
    services:
      mysql:
        image: mysql:${{ matrix.mysql }}
        env:
          MYSQL_ROOT_PASSWORD: nublox_root_password
          MYSQL_DATABASE: nublox_ci
          MYSQL_USER: nublox
          MYSQL_PASSWORD: nublox_ci_password
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h localhost -uroot -pnublox_root_password --silent"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=30
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: package.json

      - name: Install dependencies
        run: npm install --ignore-scripts

      - name: Verify caching_sha2_password against live MySQL
        env:
          MYSQL_HOST: 127.0.0.1
          MYSQL_PORT: 3306
          MYSQL_USER: nublox
          MYSQL_PASSWORD: nublox_ci_password
          MYSQL_DATABASE: nublox_ci
        run: node test/integration/modern-auth-smoke.js

      - name: Verify mysql2 live compatibility
        env:
          MYSQL_HOST: 127.0.0.1
          MYSQL_PORT: 3306
          MYSQL_USER: nublox
          MYSQL_PASSWORD: nublox_ci_password
          MYSQL_DATABASE: nublox_ci
        run: npm run test:compat:mysql2

      - name: Verify mysql2 prepared execute compatibility
        env:
          MYSQL_HOST: 127.0.0.1
          MYSQL_PORT: 3306
          MYSQL_USER: nublox
          MYSQL_PASSWORD: nublox_ci_password
          MYSQL_DATABASE: nublox_ci
        run: npm run test:compat:mysql2:execute

      - name: Verify prepared statement cache and command ordering
        env:
          MYSQL_HOST: 127.0.0.1
          MYSQL_PORT: 3306
          MYSQL_USER: nublox
          MYSQL_PASSWORD: nublox_ci_password
          MYSQL_DATABASE: nublox_ci
        run: npm run test:compat:mysql2:cache

      - name: Verify manual prepared statement lifecycle
        env:
          MYSQL_HOST: 127.0.0.1
          MYSQL_PORT: 3306
          MYSQL_USER: nublox
          MYSQL_PASSWORD: nublox_ci_password
          MYSQL_DATABASE: nublox_ci
        run: npm run test:compat:mysql2:prepare
