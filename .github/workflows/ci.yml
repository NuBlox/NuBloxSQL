name: NuBloxSQL CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    name: Node ${{ matrix.node }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24, 26]
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm
          cache-dependency-path: package.json

      - name: Install dependencies
        run: npm install --ignore-scripts

      - name: Load callback and promise entry points
        run: node -e "require('./'); require('./promise');"

      - name: Load native ESM entry points
        run: npm run test:esm

      - name: Lint
        run: npm run lint

      - name: Unit tests
        run: npm run test:unit

      - name: Smoke parser fragmentation benchmark
        if: matrix.node == 24
        env:
          BENCHMARK_PACKETS: 10000
          BENCHMARK_ROUNDS: 1
          BENCHMARK_CHUNK_SIZES: 1,16,1024,65536
        run: npm run benchmark:parser-fragmentation

      - name: Smoke PacketWriter allocation benchmark
        if: matrix.node == 24
        env:
          BENCHMARK_WRITER_BYTES: 262144
          BENCHMARK_WRITER_CHUNK_BYTES: 64
          BENCHMARK_ROUNDS: 3
        run: npm run benchmark:packet-writer

      - name: Smoke long-duration memory profile
        if: matrix.node == 24
        env:
          BENCHMARK_MEMORY_CYCLES: 5
          BENCHMARK_MEMORY_PARSER_PACKETS: 1000
          BENCHMARK_MEMORY_PARSER_PAYLOAD_BYTES: 32
          BENCHMARK_MEMORY_PARSER_CHUNK_BYTES: 16
          BENCHMARK_MEMORY_WRITER_BYTES: 131072
          BENCHMARK_MEMORY_WRITER_CHUNK_BYTES: 64
        run: npm run benchmark:memory-soak

      - name: Validate compatibility manifest
        run: npm run compatibility:check

      - name: Verify mysql2 API contract
        run: npm run test:compat:mysql2:contract

      - name: Verify publish surface
        run: npm pack --dry-run

  mysql-auth:
    name: MySQL ${{ matrix.mysql }} modern auth and mysql2 parity
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        mysql: ['8.4', '9.7']
    services:
      mysql:
        image: mysql:${{ matrix.mysql }}
        env:
          MYSQL_ROOT_PASSWORD: nublox_root_password
          MYSQL_DATABASE: nublox_ci
          MYSQL_USER: nublox
          MYSQL_PASSWORD: nublox_ci_password
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h localhost -uroot -pnublox_root_password --silent"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=30
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: package.json

      - name: Install dependencies
        run: npm install --ignore-scripts

      - name: Verify caching_sha2_password against live MySQL
        env:
          MYSQL_HOST: 127.0.0.1
          MYSQL_PORT: 3306
          MYSQL_USER: nublox
          MYSQL_PASSWORD: nublox_ci_password
          MYSQL_DATABASE: nublox_ci
        run: node test/integration/modern-auth-smoke.js

      - name: Verify zlib compressed transport
        env:
          MYSQL_HOST: 127.0.0.1
          MYSQL_PORT: 3306
          MYSQL_USER: nublox
          MYSQL_PASSWORD: nublox_ci_password
          MYSQL_DATABASE: nublox_ci
        run: npm run test:compression:zlib

      - name: Verify zstd compressed transport
        env:
          MYSQL_HOST: 127.0.0.1
          MYSQL_PORT: 3306
          MYSQL_USER: nublox
          MYSQL_PASSWORD: nublox_ci_password
          MYSQL_DATABASE: nublox_ci
        run: npm run test:compression:zstd

      - name: Verify deterministic pool warmup
        env:
          MYSQL_HOST: 127.0.0.1
          MYSQL_PORT: 3306
          MYSQL_USER: nublox
          MYSQL_PASSWORD: nublox_ci_password
          MYSQL_DATABASE: nublox_ci
        run: npm run test:pool-warmup

      - name: Verify continuous minimum-idle maintenance
        env:
          MYSQL_HOST: 127.0.0.1
          MYSQL_PORT: 3306
          MYSQL_USER: nublox
          MYSQL_PASSWORD: nublox_ci_password
          MYSQL_DATABASE: nublox_ci
        run: npm run test:pool-maintenance

      - name: Verify stream backpressure
        env:
          MYSQL_HOST: 127.0.0.1
          MYSQL_PORT: 3306
          MYSQL_USER: nublox
          MYSQL_PASSWORD: nublox_ci_password
          MYSQL_DATABASE: nublox_ci
        run: npm run test:stream-backpressure

      - name: Smoke mysql2 pool concurrency benchmark
        env:
          MYSQL_HOST: 127.0.0.1
          MYSQL_PORT: 3306
          MYSQL_USER: nublox
          MYSQL_PASSWORD: nublox_ci_password
          MYSQL_DATABASE: nublox_ci
          BENCHMARK_WARMUP: 32
          BENCHMARK_ITERATIONS: 128
          BENCHMARK_ROUNDS: 1
          BENCHMARK_CONCURRENCY: 8
          BENCHMARK_POOL_SIZE: 4
        run: npm run benchmark:mysql2:pool

      - name: Smoke mysql2 streaming benchmark
        env:
          MYSQL_HOST: 127.0.0.1
          MYSQL_PORT: 3306
          MYSQL_USER: nublox
          MYSQL_PASSWORD: nublox_ci_password
          MYSQL_DATABASE: nublox_ci
          BENCHMARK_WARMUP_ROWS: 32
          BENCHMARK_ROWS: 128
          BENCHMARK_ROUNDS: 1
          BENCHMARK_PAYLOAD_BYTES: 64
          BENCHMARK_HIGH_WATER_MARK: 4
          BENCHMARK_MEMORY_SAMPLE_EVERY: 16
        run: npm run benchmark:mysql2:streaming

      - name: Smoke mysql2 bulk work benchmark
        env:
          MYSQL_HOST: 127.0.0.1
          MYSQL_PORT: 3306
          MYSQL_USER: nublox
          MYSQL_PASSWORD: nublox_ci_password
          MYSQL_DATABASE: nublox_ci
          BENCHMARK_WARMUP_ROWS: 32
          BENCHMARK_ROWS: 128
          BENCHMARK_BATCH_SIZE: 16
          BENCHMARK_ROUNDS: 1
          BENCHMARK_PAYLOAD_BYTES: 64
        run: npm run benchmark:mysql2:bulk

      - name: Smoke mysql2 compression benchmark
        env:
          MYSQL_HOST: 127.0.0.1
          MYSQL_PORT: 3306
          MYSQL_USER: nublox
          MYSQL_PASSWORD: nublox_ci_password
          MYSQL_DATABASE: nublox_ci
          BENCHMARK_WARMUP_ROWS: 16
          BENCHMARK_ROWS: 64
          BENCHMARK_ROUNDS: 1
          BENCHMARK_PAYLOAD_BYTES: 1024
          BENCHMARK_ZSTD_LEVEL: 7
        run: npm run benchmark:mysql2:compression

      - name: Verify mysql2 live compatibility
        env:
          MYSQL_HOST: 127.0.0.1
          MYSQL_PORT: 3306
          MYSQL_USER: nublox
          MYSQL_PASSWORD: nublox_ci_password
          MYSQL_DATABASE: nublox_ci
        run: npm run test:compat:mysql2

      - name: Verify mysql2 prepared execute compatibility
        env:
          MYSQL_HOST: 127.0.0.1
          MYSQL_PORT: 3306
          MYSQL_USER: nublox
          MYSQL_PASSWORD: nublox_ci_password
          MYSQL_DATABASE: nublox_ci
        run: npm run test:compat:mysql2:execute

      - name: Verify explicit typed prepared parameters
        env:
          MYSQL_HOST: 127.0.0.1
          MYSQL_PORT: 3306
          MYSQL_USER: nublox
          MYSQL_PASSWORD: nublox_ci_password
          MYSQL_DATABASE: nublox_ci
        run: npm run test:typed-parameters

      - name: Verify temporal and JSON prepared parameters
        env:
          MYSQL_HOST: 127.0.0.1
          MYSQL_PORT: 3306
          MYSQL_USER: nublox
          MYSQL_PASSWORD: nublox_ci_password
          MYSQL_DATABASE: nublox_ci
        run: npm run test:temporal-json-parameters

      - name: Verify prepared binary result matrix
        env:
          MYSQL_HOST: 127.0.0.1
          MYSQL_PORT: 3306
          MYSQL_USER: nublox
          MYSQL_PASSWORD: nublox_ci_password
          MYSQL_DATABASE: nublox_ci
        run: npm run test:binary-results

      - name: Verify prepared statement cache and command ordering
        env:
          MYSQL_HOST: 127.0.0.1
          MYSQL_PORT: 3306
          MYSQL_USER: nublox
          MYSQL_PASSWORD: nublox_ci_password
          MYSQL_DATABASE: nublox_ci
        run: npm run test:compat:mysql2:cache

      - name: Verify manual prepared statement lifecycle
        env:
          MYSQL_HOST: 127.0.0.1
          MYSQL_PORT: 3306
          MYSQL_USER: nublox
          MYSQL_PASSWORD: nublox_ci_password
          MYSQL_DATABASE: nublox_ci
        run: npm run test:compat:mysql2:prepare

      - name: Verify prepared statement reset lifecycle
        env:
          MYSQL_HOST: 127.0.0.1
          MYSQL_PORT: 3306
          MYSQL_USER: nublox
          MYSQL_PASSWORD: nublox_ci_password
          MYSQL_DATABASE: nublox_ci
        run: npm run test:compat:mysql2:reset

      - name: Verify mysql2 named placeholder compatibility
        env:
          MYSQL_HOST: 127.0.0.1
          MYSQL_PORT: 3306
          MYSQL_USER: nublox
          MYSQL_PASSWORD: nublox_ci_password
          MYSQL_DATABASE: nublox_ci
        run: npm run test:compat:mysql2:named
