name: NuBloxSQL CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    name: Node ${{ matrix.node }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24, 26]
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
      - name: Verify workspace packages
        run: npm run verify
      - name: Assert proprietary dependency boundary
        run: npm run v1:proprietary-audit
      - name: Assert stable v1 release boundary
        run: npm run v1:release-audit
      - name: Verify NuBloxSQL single-entry publish surface
        run: npm pack --dry-run
      - name: Verify MySQL internal publish surface
        run: npm pack --dry-run --workspace @nublox/mysql
      - name: Verify SQL Core internal publish surface
        run: npm pack --dry-run --workspace @nublox/sql-core
      - name: Verify PostgreSQL internal publish surface
        run: npm pack --dry-run --workspace @nublox/postgresql
      - name: Verify SQLite internal publish surface
        run: npm pack --dry-run --workspace @nublox/sqlite
