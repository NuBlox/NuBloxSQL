name: MySQL version and restart recovery qualification

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: '17 3 * * 0'

permissions:
  contents: read

jobs:
  mysql-version-recovery:
    name: mysql-version-${{ matrix.mysql }}
    runs-on: ubuntu-latest
    timeout-minutes: 18
    strategy:
      fail-fast: false
      matrix:
        mysql: ['8.0.44', '8.4.11']
    services:
      mysql:
        image: mysql:${{ matrix.mysql }}
        env:
          MYSQL_ROOT_PASSWORD: test-password
          MYSQL_DATABASE: nublox_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -u root --password=test-password"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=40
    env:
      NUBLOX_LIVE_MYSQL: '1'
      NUBLOX_TEST_MYSQL_VERSION: ${{ matrix.mysql }}
      MYSQL_USER: root
      MYSQL_PASSWORD: test-password
      MYSQL_DATABASE: nublox_test
      MYSQL_PORT: '3306'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install build dependencies
        run: npm install --no-audit --no-fund
      - name: Install SQL procedure conformance fixtures for this MySQL version
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t containers < <(docker ps -q --filter "ancestor=mysql:${{ matrix.mysql }}")
          test "${#containers[@]}" -eq 1
          docker exec -i -e MYSQL_PWD=test-password "${containers[0]}" mysql --protocol=tcp -h127.0.0.1 -uroot nublox_test < packages/driver/tests/fixtures/multi-results.sql
      - name: Run native driver and tool regressions on MySQL ${{ matrix.mysql }}
        run: npm test
      - name: Version-specific prepared, cursor, pool and authentication qualification
        run: npm run qualify:mysql -- --iterations=30 --concurrency=2 --cursorRows=1000 --fetchSize=25
      - name: Bounded sustained-read and expected-error recovery qualification
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${{ github.event_name }}" == schedule ]]; then
            npm run soak:mysql -- --durationMs=120000 --concurrency=4 --iterations=1000000
          else
            npm run soak:mysql -- --durationMs=5000 --concurrency=2 --iterations=1000000
          fi
      - name: Kill and restart isolated MySQL server during live SQL and verify recovery
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t containers < <(docker ps -q --filter "ancestor=mysql:${{ matrix.mysql }}")
          test "${#containers[@]}" -eq 1
          export NUBLOX_ALLOW_DESTRUCTIVE_MYSQL_FIXTURE=1
          export NUBLOX_QUALIFICATION_MYSQL_VERSION="${{ matrix.mysql }}"
          export NUBLOX_QUALIFICATION_CONTAINER="${containers[0]}"
          node tools/qualification/mysql-restart-recovery.mjs
      - name: Retain version, sustained-run and restart recovery evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mysql-version-${{ matrix.mysql }}-${{ github.run_id }}
          path: artifacts/qualification/*.json
          if-no-files-found: warn
          retention-days: 30

  mysql-tls-version:
    name: mysql-tls-version-${{ matrix.mysql }}
    runs-on: ubuntu-latest
    timeout-minutes: 18
    strategy:
      fail-fast: false
      matrix:
        mysql: ['8.0.44', '8.4.11']
    env:
      NUBLOX_LIVE_MYSQL_TLS: '1'
      NUBLOX_TEST_MYSQL_VERSION: ${{ matrix.mysql }}
      MYSQL_TLS_PORT: '3307'
      MYSQL_USER: root
      MYSQL_PASSWORD: test-password
      MYSQL_DATABASE: nublox_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate fail-closed pinned TLS fixture configuration
        shell: bash
        run: |
          set -euo pipefail
          bash -n packages/driver/tests/fixtures/start-mysql-tls.sh
          if NUBLOX_TEST_MYSQL_VERSION=8.0.0 bash packages/driver/tests/fixtures/start-mysql-tls.sh; then
            echo 'Unqualified TLS image tag was incorrectly accepted' >&2
            exit 1
          fi
      - name: Start pinned certificate-verified MySQL ${{ matrix.mysql }} fixture
        shell: bash
        run: bash packages/driver/tests/fixtures/start-mysql-tls.sh
      - name: Install build dependencies
        run: npm install --no-audit --no-fund
      - name: Install SQL stored-procedure conformance fixtures over isolated TLS host
        shell: bash
        run: |
          set -euo pipefail
          docker exec -i -e MYSQL_PWD=test-password nubloxsql-mysql-tls \
            mysql --protocol=tcp -h127.0.0.1 -uroot nublox_test \
            < packages/driver/tests/fixtures/multi-results.sql
      - name: Run certificate validation, authentication, transaction, cursor and pool regressions
        run: npm test
      - name: Require trusted TLS authentication and negative-credential qualification
        run: npm run qualify:mysql -- --iterations=24 --concurrency=3 --authAttempts=12 --cursorRows=100 --fetchSize=25
      - name: Preserve MySQL-version-specific verified-TLS evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mysql-tls-version-${{ matrix.mysql }}-${{ github.run_id }}
          path: artifacts/qualification/*.json
          if-no-files-found: error
          retention-days: 30
      - name: Show test-only MySQL logs on failure
        if: failure()
        run: docker logs nubloxsql-mysql-tls 2>&1 | tail -100 || true
      - name: Remove isolated TLS fixture and ephemeral certificate material
        if: always()
        shell: bash
        run: |
          docker rm -f nubloxsql-mysql-tls >/dev/null 2>&1 || true
          rm -rf "${RUNNER_TEMP}/nubloxsql-mysql-tls"

  mysql-matrix-evidence:
    name: mysql-qualification-evidence
    if: ${{ always() }}
    needs: [mysql-version-recovery, mysql-tls-version]
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Require every native and TLS matrix job to succeed
        shell: bash
        run: |
          set -euo pipefail
          test "${{ needs.mysql-version-recovery.result }}" = success
          test "${{ needs.mysql-tls-version.result }}" = success
      - name: Fetch redacted evidence from both version/transport matrices
        uses: actions/download-artifact@v4
        with:
          pattern: mysql-*
          path: artifacts/matrix
          merge-multiple: false
      - name: Test the fail-closed evidence validator
        run: node --test tools/qualification/verify-matrix-evidence.test.mjs
      - name: Verify all eight reports share the same revision and passed assertions
        run: node tools/qualification/verify-matrix-evidence.mjs artifacts/matrix
      - name: Preserve one matrix-wide release-evidence decision
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mysql-qualification-evidence-${{ github.run_id }}
          path: artifacts/qualification-matrix/*.json
          if-no-files-found: warn
          retention-days: 30
