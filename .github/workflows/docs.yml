name: Documentation baseline

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify documentation-first foundation
        shell: bash
        run: |
          set -euo pipefail
          test -f LICENSE
          test -f NOTICE
          test -f README.md
          test ! -e package.json
          test ! -e index.js
          test ! -d apps
          test ! -d lib
          test ! -d test
          test ! -d scripts
          python3 - <<'PY'
          from pathlib import Path
          import re
          docs = [
              'docs/PRODUCT.md',
              'docs/USERS-AND-LIFECYCLE.md',
              'docs/REQUIREMENTS.md',
              'docs/ARCHITECTURE.md',
              'docs/WORK-REGISTER.md',
              'docs/SUPPORT-AND-QUALIFICATION.md',
              'docs/ROADMAP.md',
              'docs/DECISIONS.md',
              'docs/ARCHIVE.md',
          ]
          for doc in docs:
              assert Path(doc).is_file(), f'Missing authority: {doc}'
          for md in [Path('README.md'), *Path('docs').glob('*.md')]:
              for link in re.findall(r'\]\(([^)]+)\)', md.read_text()):
                  if link.startswith(('https://','http://','mailto:','#')):
                      continue
                  target = link.split('#', 1)[0]
                  if not target:
                      continue
                  assert (md.parent / target).exists(), f'Broken local link: {md}: {link}'
          print('NuBloxSQL docs-only authority and links: PASS')
          PY
