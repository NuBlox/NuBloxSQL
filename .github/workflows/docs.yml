name: Documentation baseline

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  docs:
    name: docs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Validate product-definition reset
        shell: bash
        run: |
          set -euo pipefail
          test -f README.md
          test -f LICENSE
          test -f NOTICE
          test -f docs/PRODUCT.md
          test -f docs/DRIVER.md
          test -f docs/ARCHIVES.md
          test ! -e package.json
          test ! -d packages
          test ! -d apps
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import {readFileSync,existsSync} from 'node:fs';
          import {resolve,dirname} from 'node:path';
          const content=readFileSync('docs/PRODUCT.md','utf8').toLowerCase();
          for(const term of ['nubloxsql driver','nubloxsql shell','nubloxsql workbench','entire database lifecycle','non-sql','select','retire']){
            assert.ok(content.includes(term),'Missing product term: '+term);
          }
          const blueprint=readFileSync('docs/DRIVER.md','utf8').toLowerCase();
          for(const term of ['vendor adapter','native','first complete vertical slice','end-to-end acceptance gates','non-sql','mysql 8.4']){
            assert.ok(blueprint.includes(term),'Missing blueprint requirement: '+term);
          }
          const archive=readFileSync('docs/ARCHIVES.md','utf8');
          for(const sha of ['4ed0e35fbfe71ac110c9ec41cf62ba3355e9d56c','8beb6cc9920494d9bfbf8756bddece3a8492018f'])
            assert.ok(archive.includes(sha),'Missing archive: '+sha);
          for(const file of ['README.md','docs/PRODUCT.md','docs/DRIVER.md','docs/ARCHIVES.md']){
            const links=readFileSync(file,'utf8').matchAll(/\]\(([^)]+)\)/g);
            for(const match of links){
              const dest=match[1];
              if(/^(https?:|mailto:|#)/.test(dest))continue;
              const local=dest.split('#')[0];
              if(local)assert.ok(existsSync(resolve(dirname(file),local)),file+' missing '+local);
            }
          }
          NODE
          echo 'Product definition baseline: PASS'
