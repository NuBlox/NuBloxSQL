name: NuBloxSQL PostgreSQL Dialect

on:
  pull_request:
    paths:
      - 'index.js'
      - 'index.d.ts'
      - 'package.json'
      - 'lib/client/**'
      - 'lib/capabilities/**'
      - 'test/client-api.js'
      - 'test/client-live.js'
      - 'test/client-types-live.js'
      - 'test/client-transaction-live.js'
      - 'test/client-operation-live.js'
      - 'test/compiler-query-live.js'
      - 'test/compiler-ddl-live.js'
      - 'test/compiler-ddl-lifecycle-live.js'
      - 'test/compiler-ddl-column-constraints-live.js'
      - 'test/compiler-ddl-object-lifecycle-live.js'
      - 'test/compiler-ddl-dependency-concurrent-live.js'
      - 'test/sql-ast-compiler.js'
      - 'test/operation-control.js'
      - 'lib/dialects/postgresql/**'
      - 'lib/core/**'
      - '.github/workflows/postgresql-dialect.yml'
  push:
    branches: [main]
    paths:
      - 'index.js'
      - 'index.d.ts'
      - 'package.json'
      - 'lib/client/**'
      - 'lib/capabilities/**'
      - 'test/client-api.js'
      - 'test/client-live.js'
      - 'test/client-types-live.js'
      - 'test/client-transaction-live.js'
      - 'test/client-operation-live.js'
      - 'test/compiler-query-live.js'
      - 'test/compiler-ddl-live.js'
      - 'test/compiler-ddl-lifecycle-live.js'
      - 'test/compiler-ddl-column-constraints-live.js'
      - 'test/compiler-ddl-object-lifecycle-live.js'
      - 'test/compiler-ddl-dependency-concurrent-live.js'
      - 'test/sql-ast-compiler.js'
      - 'test/operation-control.js'
      - 'lib/dialects/postgresql/**'
      - 'lib/core/**'
      - '.github/workflows/postgresql-dialect.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  contract:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24, 26]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
      - run: npm run test:postgresql

  live-postgresql:
    name: live PostgreSQL ${{ matrix.postgresql }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        postgresql: ['15', '16', '17', '18']
    services:
      postgres:
        image: postgres:${{ matrix.postgresql }}
        env:
          POSTGRES_USER: nublox
          POSTGRES_PASSWORD: nublox_ci_password
          POSTGRES_DB: nublox
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U nublox -d nublox"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      NUBLOX_DIALECT: postgresql
      PGHOST: 127.0.0.1
      PGPORT: 5432
      PGUSER: nublox
      PGPASSWORD: nublox_ci_password
      PGDATABASE: nublox
      PG_EXPECTED_MAJOR: ${{ matrix.postgresql }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Unified NuBloxSQL client contract
        run: node test/client-live.js
      - name: Portable type codec contract
        run: node test/client-types-live.js
      - name: Advanced transaction contract
        run: node test/client-transaction-live.js
      - name: Portable operation control contract
        run: node test/client-operation-live.js
      - name: SQL compiler live qualification
        run: node test/compiler-query-live.js
      - name: DDL compiler live qualification
        run: node test/compiler-ddl-live.js
      - name: DDL lifecycle live qualification
        run: node test/compiler-ddl-lifecycle-live.js
      - name: DDL column and constraint lifecycle qualification
        run: node test/compiler-ddl-column-constraints-live.js
      - name: DDL object lifecycle qualification
        run: node test/compiler-ddl-object-lifecycle-live.js
      - name: DDL dependency and concurrent index qualification
        run: node test/compiler-ddl-dependency-concurrent-live.js
      - name: Native runtime, extended protocol, cancellation, pooling and portals
        run: node lib/dialects/postgresql/test/live.js
      - name: Native COPY FROM/TO streaming and pool qualification
        run: node lib/dialects/postgresql/test/live-copy.js
      - name: Native LISTEN/NOTIFY asynchronous notification qualification
        run: node lib/dialects/postgresql/test/live-notifications.js
      - name: Structured EXPLAIN and EXPLAIN ANALYZE diagnostics
        run: node lib/dialects/postgresql/test/live-diagnostics.js
      - name: Deep catalog introspection qualification
        run: node lib/dialects/postgresql/test/live-deep-metadata.js
      - name: Authentication and TLS failure paths
        run: node lib/dialects/postgresql/test/live-failure-paths.js
      - name: Result-limit connection and pool safety
        run: node lib/dialects/postgresql/test/live-result-limits.js
      - name: Deterministic lossless type policy
        run: node lib/dialects/postgresql/test/live-type-decoding.js
      - name: Production performance and memory evidence
        if: matrix.postgresql == '15' || matrix.postgresql == '18'
        run: node --expose-gc lib/dialects/postgresql/test/live-production-evidence.js
