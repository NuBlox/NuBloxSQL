name: NuBloxSQL PostgreSQL Dialect

on:
  pull_request:
    paths:
      - 'packages/postgresql/**'
      - 'packages/sql-core/**'
      - '.github/workflows/postgresql-dialect.yml'
  push:
    branches: [main]
    paths:
      - 'packages/postgresql/**'
      - 'packages/sql-core/**'
      - '.github/workflows/postgresql-dialect.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  contract:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24, 26]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
      - run: npm run test --workspace @nublox/postgresql
      - run: npm pack --dry-run --workspace @nublox/postgresql

  live-postgresql:
    name: live PostgreSQL ${{ matrix.postgresql }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        postgresql: ['15', '16', '17', '18']
    services:
      postgres:
        image: postgres:${{ matrix.postgresql }}
        env:
          POSTGRES_USER: nublox
          POSTGRES_PASSWORD: nublox_ci_password
          POSTGRES_DB: nublox
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U nublox -d nublox"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      PGHOST: 127.0.0.1
      PGPORT: 5432
      PGUSER: nublox
      PGPASSWORD: nublox_ci_password
      PGDATABASE: nublox
      PG_EXPECTED_MAJOR: ${{ matrix.postgresql }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Native runtime, extended protocol, cancellation, pooling and portals
        run: npm run test:live --workspace @nublox/postgresql
      - name: Authentication and TLS failure paths
        run: npm run test:live:failures --workspace @nublox/postgresql
      - name: Result-limit connection and pool safety
        run: npm run test:live:limits --workspace @nublox/postgresql
      - name: Deterministic lossless type policy
        run: npm run test:live:types --workspace @nublox/postgresql
