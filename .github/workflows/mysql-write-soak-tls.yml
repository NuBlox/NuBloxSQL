name: MySQL verified-TLS durable write qualification

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      hours:
        description: Isolated TLS write endurance duration
        type: choice
        required: true
        default: '1'
        options: ['1', '2']
  schedule:
    - cron: '29 3 * * 0'

permissions:
  contents: read

jobs:
  tls-write-soak:
    name: mysql-verified-tls-write-soak
    runs-on: ubuntu-latest
    timeout-minutes: 140
    env:
      NUBLOX_WRITE_SOAK_PROFILE: verified-tls
      NUBLOX_LIVE_MYSQL_TLS: '1'
      NUBLOX_ALLOW_WRITE_MYSQL_FIXTURE: '1'
      NUBLOX_QUALIFICATION_MYSQL_VERSION: '8.4.13'
      NUBLOX_TEST_MYSQL_VERSION: '8.4.13'
      MYSQL_USER: root
      MYSQL_PASSWORD: test-password
      MYSQL_WRITE_USER: nublox_write_test
      MYSQL_WRITE_PASSWORD: test-write-password
      MYSQL_DATABASE: nublox_test
      MYSQL_TLS_PORT: '3307'
      NUBLOX_ENDURANCE_HOURS: ${{ inputs.hours || '0' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Start pinned MySQL 8.4.13 temporary-CA TLS-only fixture
        run: bash packages/driver/tests/fixtures/start-mysql-tls.sh
      - name: Install and compile reviewed native driver
        run: |
          npm ci --no-audit --no-fund
          npm run build
      - name: Verify pinned container, MySQL server and required TLS
        shell: bash
        run: |
          set -euo pipefail
          image="$(docker inspect -f '{{.Config.Image}}' nubloxsql-mysql-tls)"
          test "$image" = mysql:8.4.13
          version="$(docker exec -e MYSQL_PWD=test-password nubloxsql-mysql-tls \
            mysql --protocol=tcp -h127.0.0.1 -uroot -N -s -e 'SELECT VERSION()')"
          case "$version" in
            8.4.13|8.4.13-*) ;;
            *) echo 'Unexpected MySQL version' >&2; exit 1 ;;
          esac
          secure="$(docker exec -e MYSQL_PWD=test-password nubloxsql-mysql-tls \
            mysql --protocol=tcp -h127.0.0.1 -uroot -N -s \
            -e 'SELECT @@global.require_secure_transport')"
          test "$secure" = 1
      - name: Configure restricted TLS writer without table DDL or INSERT grants
        shell: bash
        run: |
          set -euo pipefail
          docker exec -e MYSQL_PWD=test-password nubloxsql-mysql-tls \
            mysql --protocol=tcp -h127.0.0.1 -uroot nublox_test -e \
            "CREATE USER 'nublox_write_test'@'%' IDENTIFIED WITH caching_sha2_password BY 'test-write-password' REQUIRE SSL; GRANT SELECT, UPDATE ON nublox_test.* TO 'nublox_write_test'@'%';"
      - name: Validate write and security-evidence policies
        run: |
          node --test tools/qualification/write-soak.test.mjs \
            tools/qualification/write-soak-evidence.test.mjs
      - name: Execute real TLS durable write and rollback qualification
        shell: bash
        run: |
          set -euo pipefail
          case "$GITHUB_EVENT_NAME" in
            pull_request|push) duration_ms=10000 ;;
            schedule) duration_ms=1800000 ;;
            workflow_dispatch)
              case "$NUBLOX_ENDURANCE_HOURS" in
                1|2) duration_ms=$(( NUBLOX_ENDURANCE_HOURS * 3600000 )) ;;
                *) exit 1 ;;
              esac ;;
            *) exit 1 ;;
          esac
          node tools/qualification/run-write-soak.mjs \
            --durationMs="$duration_ms" --concurrency=4 \
            --maxTransactions=100000000
      - name: Preserve TLS write evidence on success or failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mysql-write-soak-tls-${{ github.run_id }}
          path: artifacts/qualification/mysql-write-soak-tls-*.json
          if-no-files-found: error
          retention-days: 60
      - name: Destroy fixture and ephemeral certificates
        if: always()
        shell: bash
        run: |
          docker rm -f nubloxsql-mysql-tls >/dev/null 2>&1 || true
          rm -rf "$RUNNER_TEMP/nubloxsql-mysql-tls"

  tls-write-evidence:
    name: mysql-verified-tls-write-evidence
    if: always()
    needs: [tls-write-soak]
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      NUBLOX_WRITE_SOAK_PROFILE: verified-tls
      NUBLOX_ENDURANCE_HOURS: ${{ inputs.hours || '0' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Require passed upstream TLS write workload
        run: test "${{ needs.tls-write-soak.result }}" = success
      - name: Download original report from same GitHub run
        uses: actions/download-artifact@v4
        with:
          name: mysql-write-soak-tls-${{ github.run_id }}
          path: artifacts/write-soak-tls-evidence
      - name: Independently validate TLS security and durable outcomes
        run: |
          node --test tools/qualification/write-soak-evidence.test.mjs
          node tools/qualification/verify-write-soak-evidence.mjs \
            artifacts/write-soak-tls-evidence
      - name: Retain verified TLS write decision
        uses: actions/upload-artifact@v4
        with:
          name: mysql-write-soak-tls-decision-${{ github.run_id }}
          path: artifacts/qualification-matrix/mysql-write-soak-tls-decision-*.json
          if-no-files-found: error
          retention-days: 60
