name: NuBloxSQL SQL Server

on:
  pull_request:
    paths:
      - 'index.js'
      - 'index.d.ts'
      - 'package.json'
      - 'lib/client/**'
      - 'lib/dialects/sqlserver/**'
      - '.github/workflows/sqlserver.yml'
  push:
    branches: [main]
    paths:
      - 'index.js'
      - 'index.d.ts'
      - 'package.json'
      - 'lib/client/**'
      - 'lib/dialects/sqlserver/**'
      - '.github/workflows/sqlserver.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  contract:
    name: SQL Server contracts (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24, 26]
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
      - name: Verify SQL Server protocol and connection contracts
        run: npm run test:sqlserver

  live:
    name: live SQL Server 2022
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Provision ephemeral SQL Server TLS identity
        shell: bash
        run: |
          mkdir -p .ci/sqlserver
          openssl req -x509 -nodes -newkey rsa:2048 \
            -subj '/CN=localhost' \
            -addext 'subjectAltName=DNS:localhost,IP:127.0.0.1' \
            -keyout .ci/sqlserver/mssql.key \
            -out .ci/sqlserver/mssql.pem \
            -days 1
          cat > .ci/sqlserver/mssql.conf <<'EOF'
          [network]
          tlscert = /etc/ssl/certs/mssql.pem
          tlskey = /etc/ssl/private/mssql.key
          tlsprotocols = 1.2
          forceencryption = 0
          EOF
          chmod 644 .ci/sqlserver/mssql.key .ci/sqlserver/mssql.pem .ci/sqlserver/mssql.conf
      - name: Start disposable SQL Server 2022
        shell: bash
        run: |
          password="Nbx_${GITHUB_RUN_ID}_${GITHUB_RUN_ATTEMPT}_Aa1!"
          echo "MSSQL_SA_PASSWORD=$password" >> "$GITHUB_ENV"
          docker run --detach --name nublox-sqlserver \
            --publish 1433:1433 \
            --env ACCEPT_EULA=Y \
            --env MSSQL_PID=Developer \
            --env "MSSQL_SA_PASSWORD=$password" \
            --volume "$PWD/.ci/sqlserver/mssql.conf:/var/opt/mssql/mssql.conf:ro" \
            --volume "$PWD/.ci/sqlserver/mssql.pem:/etc/ssl/certs/mssql.pem:ro" \
            --volume "$PWD/.ci/sqlserver/mssql.key:/etc/ssl/private/mssql.key:ro" \
            mcr.microsoft.com/mssql/server:2022-latest
      - name: Wait for SQL Server engine readiness
        shell: bash
        run: |
          for attempt in $(seq 1 90); do
            if docker logs nublox-sqlserver 2>&1 | grep -q 'SQL Server is now ready for client connections'; then
              exit 0
            fi
            sleep 1
          done
          docker logs nublox-sqlserver
          echo 'SQL Server did not report engine readiness within 90 seconds' >&2
          exit 1
      - name: Native TDS 8 TLS, PRELOGIN and LOGIN7 qualification
        env:
          MSSQL_HOST: 127.0.0.1
          MSSQL_PORT: 1433
        run: node lib/dialects/sqlserver/test/live-connection.js
      - name: Show SQL Server logs on failure
        if: failure()
        run: docker logs nublox-sqlserver || true
      - name: Stop SQL Server
        if: always()
        run: docker rm --force nublox-sqlserver || true
