name: NuBloxSQL SQLite

on:
  push:
    branches: [main]
    paths:
      - 'index.js'
      - 'index.d.ts'
      - 'package.json'
      - 'lib/client/**'
      - 'lib/capabilities/**'
      - 'test/compiler-query-live.js'
      - 'test/compiler-ddl-live.js'
      - 'test/compiler-ddl-lifecycle-live.js'
      - 'test/sql-ast-compiler.js'
      - 'lib/dialects/sqlite/**'
      - '.github/workflows/sqlite-dialect.yml'
  pull_request:
    paths:
      - 'index.js'
      - 'index.d.ts'
      - 'package.json'
      - 'lib/client/**'
      - 'lib/capabilities/**'
      - 'test/compiler-query-live.js'
      - 'test/compiler-ddl-live.js'
      - 'test/compiler-ddl-lifecycle-live.js'
      - 'test/sql-ast-compiler.js'
      - 'lib/dialects/sqlite/**'
      - '.github/workflows/sqlite-dialect.yml'

permissions:
  contents: read

jobs:
  qualification:
    name: SQLite production qualification (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24, 26]
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
      - name: SQLite runtime contracts
        run: npm run test:sqlite
      - name: SQL compiler live qualification
        run: node test/compiler-query-live.js
        env:
          NUBLOX_DIALECT: sqlite
      - name: DDL compiler live qualification
        run: node test/compiler-ddl-live.js
        env:
          NUBLOX_DIALECT: sqlite
      - name: DDL lifecycle live qualification
        run: node test/compiler-ddl-lifecycle-live.js
        env:
          NUBLOX_DIALECT: sqlite
      - name: SQLite production performance and memory evidence
        run: npm run test:sqlite-production
      - name: SQLite corruption error classification
        run: node lib/dialects/sqlite/test/corruption-error-classification.js
      - name: SQLite corruption and hostile-metadata hardening
        run: node lib/dialects/sqlite/test/production-corruption.js
