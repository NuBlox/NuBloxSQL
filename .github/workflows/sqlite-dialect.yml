name: NuBloxSQL SQLite

on:
  push:
    branches: [main]
    paths:
      - 'index.js'
      - 'index.d.ts'
      - 'package.json'
      - 'lib/client/**'
      - 'lib/runtime/**'
      - 'lib/capabilities/**'
      - 'test/sql/integration/compiler-query-live.js'
      - 'test/sql/integration/compiler-dml-advanced-live.js'
      - 'test/sql/integration/compiler-dml-source-composition-live.js'
      - 'test/sql/integration/compiler-ddl-live.js'
      - 'test/sql/integration/compiler-ddl-lifecycle-live.js'
      - 'test/sql/integration/compiler-ddl-column-constraints-live.js'
      - 'test/sql/integration/compiler-ddl-object-lifecycle-live.js'
      - 'test/sql/integration/compiler-ddl-generated-identity-live.js'
      - 'test/sql/integration/compiler-ddl-foreign-keys-live.js'
      - 'test/sql/integration/compiler-ddl-index-semantics-live.js'
      - 'test/sql/integration/compiler-ddl-index-key-options-live.js'
      - 'test/sql/integration/compiler-ddl-ctas-live.js'
      - 'test/sql/integration/compiler-ddl-identity-sequence-live.js'
      - 'test/sql/ast/sql-ast-compiler.js'
      - 'lib/dialects/sqlite/**'
      - '.github/workflows/sqlite-dialect.yml'
  pull_request:
    paths:
      - 'index.js'
      - 'index.d.ts'
      - 'package.json'
      - 'lib/client/**'
      - 'lib/runtime/**'
      - 'lib/capabilities/**'
      - 'test/sql/integration/compiler-query-live.js'
      - 'test/sql/integration/compiler-dml-advanced-live.js'
      - 'test/sql/integration/compiler-dml-source-composition-live.js'
      - 'test/sql/integration/compiler-ddl-live.js'
      - 'test/sql/integration/compiler-ddl-lifecycle-live.js'
      - 'test/sql/integration/compiler-ddl-column-constraints-live.js'
      - 'test/sql/integration/compiler-ddl-object-lifecycle-live.js'
      - 'test/sql/integration/compiler-ddl-generated-identity-live.js'
      - 'test/sql/integration/compiler-ddl-foreign-keys-live.js'
      - 'test/sql/integration/compiler-ddl-index-semantics-live.js'
      - 'test/sql/ast/sql-ast-compiler.js'
      - 'lib/dialects/sqlite/**'
      - '.github/workflows/sqlite-dialect.yml'

permissions:
  contents: read

jobs:
  qualification:
    name: SQLite production qualification (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24, 26]
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
      - name: SQLite runtime contracts
        run: npm run test:sqlite
      - name: SQL compiler live qualification
        run: node test/sql/integration/compiler-query-live.js
      - name: Advanced DML compiler live qualification
        run: node test/sql/integration/compiler-dml-advanced-live.js
        env:
          NUBLOX_DIALECT: sqlite
      - name: Rich DML source composition live qualification
        run: node test/sql/integration/compiler-dml-source-composition-live.js
        env:
          NUBLOX_DIALECT: sqlite
      - name: DDL compiler live qualification
        run: node test/sql/integration/compiler-ddl-live.js
        env:
          NUBLOX_DIALECT: sqlite
      - name: DDL lifecycle live qualification
        run: node test/sql/integration/compiler-ddl-lifecycle-live.js
        env:
          NUBLOX_DIALECT: sqlite
      - name: DDL column and constraint lifecycle qualification
        run: node test/sql/integration/compiler-ddl-column-constraints-live.js
        env:
          NUBLOX_DIALECT: sqlite
      - name: DDL object lifecycle qualification
        run: node test/sql/integration/compiler-ddl-object-lifecycle-live.js
        env:
          NUBLOX_DIALECT: sqlite
      - name: DDL generated column qualification
        run: node test/sql/integration/compiler-ddl-generated-identity-live.js
        env:
          NUBLOX_DIALECT: sqlite
      - name: DDL foreign-key semantic qualification
        run: node test/sql/integration/compiler-ddl-foreign-keys-live.js
      - name: DDL advanced index semantic qualification
        run: node test/sql/integration/compiler-ddl-index-semantics-live.js
        env:
          NUBLOX_DIALECT: sqlite
      - name: DDL index key option qualification
        run: node test/sql/integration/compiler-ddl-index-key-options-live.js
        env:
          NUBLOX_DIALECT: sqlite
      - name: DDL CREATE TABLE AS qualification
        run: node test/sql/integration/compiler-ddl-ctas-live.js
      - name: DDL identity/autoincrement/sequence qualification
        run: node test/sql/integration/compiler-ddl-identity-sequence-live.js
        env:
          NUBLOX_DIALECT: sqlite
      - name: SQLite production performance and memory evidence
        run: npm run test:sqlite-production
      - name: SQLite corruption error classification
        run: node lib/dialects/sqlite/test/corruption-error-classification.js
      - name: SQLite corruption and hostile-metadata hardening
        run: node lib/dialects/sqlite/test/production-corruption.js
