name: Native MySQL sustained qualification

on:
  workflow_dispatch:
  schedule:
    - cron: '31 2 * * *'

permissions:
  contents: read

jobs:
  mysql-soak:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    services:
      mysql:
        image: mysql:8.4.11
        env:
          MYSQL_ROOT_PASSWORD: test-password
          MYSQL_DATABASE: nublox_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -u root --password=test-password"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install build dependencies
        run: npm ci --no-audit --no-fund
      - name: Sustained pooled reads, session recovery and resource qualification
        run: npm run soak:mysql -- --durationMs=120000 --concurrency=4 --iterations=1000000
        env:
          NUBLOX_LIVE_MYSQL: '1'
          MYSQL_USER: root
          MYSQL_PASSWORD: test-password
      - name: Preserve bounded qualification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mysql-soak-${{ github.run_id }}
          path: artifacts/qualification/*.json
          if-no-files-found: warn
          retention-days: 30
