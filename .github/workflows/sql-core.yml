name: NuBloxSQL SQL Core

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  contracts:
    name: Node ${{ matrix.node }} contracts
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node:
          - 22
          - 24
          - 26

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - name: Install dependencies
        run: npm install --ignore-scripts

      - name: Verify SQL core runtime contracts
        run: npm run test:sql-core

      - name: Verify TypeScript contracts
        run: npm run test:types

      - name: Verify SQL core publish surface
        run: npm pack --dry-run --prefix packages/sql-core
