name: Native MySQL TLS prepared cache endurance and memory evidence

on:
  pull_request:
    paths:
      - 'tools/qualification/cache-endurance*.mjs'
      - 'tools/qualification/run-cache-endurance.mjs'
      - 'tools/qualification/verify-cache-endurance-evidence.mjs'
      - '.github/workflows/mysql-cache-endurance-tls.yml'
      - 'packages/driver/**'
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      minutes:
        description: Minutes on an isolated verified-TLS MySQL service
        type: choice
        required: true
        default: '30'
        options: ['30', '60']
  schedule:
    - cron: '07 4 * * 0'

permissions:
  contents: read

jobs:
  cache-endurance:
    name: mysql-cache-verified-tls-endurance
    runs-on: ubuntu-latest
    timeout-minutes: 75
    env:
      CI: 'true'
      NUBLOX_LIVE_MYSQL_TLS: '1'
      NUBLOX_CACHE_BENCH_FIXTURE: '1'
      NUBLOX_TEST_MYSQL_VERSION: '8.4.13'
      NUBLOX_QUALIFICATION_MYSQL_VERSION: '8.4.13'
      NUBLOX_ENDURANCE_MINUTES: ${{ inputs.minutes || '0' }}
      MYSQL_TLS_PORT: '3307'
      MYSQL_USER: root
      MYSQL_PASSWORD: test-password
      MYSQL_DATABASE: nublox_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Start disposable CA-verified TLS-only MySQL fixture
        run: bash packages/driver/tests/fixtures/start-mysql-tls.sh
      - name: Build native driver and run independent negative regressions
        run: |
          npm ci --no-audit --no-fund
          npm run build
          node --test tools/qualification/cache-endurance.test.mjs
      - name: Verify server identity and enforce eight global prepared handles
        shell: bash
        run: |
          set -euo pipefail
          test "$(docker inspect -f '{{.Config.Image}}' nubloxsql-mysql-tls)" = 'mysql:8.4.13'
          mysql() {
            docker exec -e MYSQL_PWD=test-password nubloxsql-mysql-tls \
              mysql --protocol=tcp -h127.0.0.1 -uroot -N -s "$@"
          }
          version="$(mysql -e 'SELECT VERSION()')"
          case "$version" in
            8.4.13|8.4.13-*) ;;
            *) echo 'Unexpected pinned MySQL version'; exit 1 ;;
          esac
          test "$(mysql -e 'SELECT @@global.require_secure_transport')" = 1
          mysql -e 'SET GLOBAL max_prepared_stmt_count = 8'
          test "$(mysql -e 'SELECT @@global.max_prepared_stmt_count')" = 8
      - name: Run event-bounded verified TLS cache endurance
        shell: bash
        run: |
          set -euo pipefail
          case "$GITHUB_EVENT_NAME" in
            pull_request|push) duration_ms=12000 ;;
            schedule) duration_ms=1800000 ;;
            workflow_dispatch)
              case "$NUBLOX_ENDURANCE_MINUTES" in
                30|60) duration_ms=$((NUBLOX_ENDURANCE_MINUTES * 60000)) ;;
                *) echo 'Invalid manual duration'; exit 1 ;;
              esac ;;
            *) echo 'Unapproved endurance event'; exit 1 ;;
          esac
          node --expose-gc tools/qualification/run-cache-endurance.mjs \
            --durationMs="$duration_ms" --concurrency=8 --maxOperations=100000000
      - name: Retain redacted original result, memory and window latency evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mysql-cache-endurance-tls-${{ github.run_id }}
          path: artifacts/qualification/mysql-cache-endurance-tls-*.json
          if-no-files-found: error
          retention-days: 60
      - name: Destroy ephemeral TLS server and certificate private keys
        if: always()
        shell: bash
        run: |
          docker rm -f nubloxsql-mysql-tls >/dev/null 2>&1 || true
          rm -rf "$RUNNER_TEMP/nubloxsql-mysql-tls"

  cache-endurance-evidence:
    name: mysql-cache-verified-tls-endurance-evidence
    if: always()
    needs: [cache-endurance]
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      NUBLOX_ENDURANCE_MINUTES: ${{ inputs.minutes || '0' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Require completed upstream real-server workload
        run: test "${{ needs.cache-endurance.result }}" = success
      - name: Download exact original same-run cache endurance report
        uses: actions/download-artifact@v4
        with:
          name: mysql-cache-endurance-tls-${{ github.run_id }}
          path: artifacts/original-cache-endurance
      - name: Independently reject incomplete, fabricated and leaked-resource reports
        run: |
          node --test tools/qualification/cache-endurance.test.mjs
          node tools/qualification/verify-cache-endurance-evidence.mjs \
            artifacts/original-cache-endurance
      - name: Preserve independent qualification evidence decision
        uses: actions/upload-artifact@v4
        with:
          name: mysql-cache-endurance-tls-decision-${{ github.run_id }}
          path: artifacts/qualification-matrix/mysql-cache-endurance-tls-decision-*.json
          if-no-files-found: error
          retention-days: 60
