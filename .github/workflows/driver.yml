name: Native MySQL 8.4 Driver

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  native-mysql:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.4.11
        env:
          MYSQL_ROOT_PASSWORD: test-password
          MYSQL_DATABASE: nublox_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -u root --password=test-password"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install build dependencies
        run: npm install --no-audit --no-fund
      - name: Build TypeScript and test real MySQL 8.4
        run: npm test
        env:
          NUBLOX_LIVE_MYSQL: '1'
          MYSQL_USER: root
          MYSQL_PASSWORD: test-password
      - name: Validate standalone package contents
        run: npm pack --dry-run --workspace @nublox/driver
