name: Native MySQL 8.4 Driver

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  native-mysql:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.4.11
        env:
          MYSQL_ROOT_PASSWORD: test-password
          MYSQL_DATABASE: nublox_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -u root --password=test-password"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install build dependencies
        run: npm install --no-audit --no-fund
      - name: Build TypeScript and test real MySQL 8.4
        run: npm test
        env:
          NUBLOX_LIVE_MYSQL: '1'
          MYSQL_USER: root
          MYSQL_PASSWORD: test-password
      - name: Validate standalone package contents
        run: npm pack --dry-run --workspace @nublox/driver
      - name: Qualification smoke against pinned MySQL 8.4
        run: npm run qualify:mysql -- --iterations=30 --concurrency=2 --cursorRows=1000 --fetchSize=25
        env:
          NUBLOX_LIVE_MYSQL: '1'
          MYSQL_USER: root
          MYSQL_PASSWORD: test-password
      - name: Qualification soak smoke validates duration and expected-error recovery
        run: npm run soak:mysql -- --durationMs=1500 --concurrency=2 --iterations=1000000
        env:
          NUBLOX_LIVE_MYSQL: '1'
          MYSQL_USER: root
          MYSQL_PASSWORD: test-password
      - name: Retain reproducible MySQL qualification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mysql-qualification-${{ github.run_id }}
          path: artifacts/qualification/*.json
          if-no-files-found: warn
          retention-days: 14

  native-mysql-tls:
    name: verified-tls-mysql
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Start pinned TLS-only MySQL 8.4 server with temporary test CA
        shell: bash
        run: bash packages/driver/tests/fixtures/start-mysql-tls.sh
      - name: Install build dependencies
        run: npm install --no-audit --no-fund
      - name: Run live TLS identity, authentication and prepared-query tests
        run: npm test
        env:
          NUBLOX_LIVE_MYSQL_TLS: '1'
          MYSQL_TLS_PORT: '3307'
          MYSQL_USER: root
          MYSQL_PASSWORD: test-password
      - name: TLS fixture logs on failure
        if: failure()
        run: docker logs nubloxsql-mysql-tls 2>&1 | tail -100 || true
      - name: Remove TLS test container and ephemeral certificates
        if: always()
        shell: bash
        run: |
          docker rm -f nubloxsql-mysql-tls >/dev/null 2>&1 || true
          rm -rf "${RUNNER_TEMP}/nubloxsql-mysql-tls"
