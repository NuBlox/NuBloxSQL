name: NuBloxSQL Redis Native

on:
  pull_request:
    paths:
      - 'index.js'
      - 'index.d.ts'
      - 'package.json'
      - 'lib/runtime/**'
      - 'lib/dialects/redis/**'
      - 'lib/catalog/DatabaseTechnologyRegistry.js'
      - 'types/native.d.ts'
      - 'types/database-technology.d.ts'
      - 'test/database-technology-foundation.js'
      - '.github/workflows/redis-native.yml'
  push:
    branches: [main]
    paths:
      - 'index.js'
      - 'index.d.ts'
      - 'package.json'
      - 'lib/runtime/**'
      - 'lib/dialects/redis/**'
      - 'lib/catalog/DatabaseTechnologyRegistry.js'
      - 'types/native.d.ts'
      - 'types/database-technology.d.ts'
      - 'test/database-technology-foundation.js'
      - '.github/workflows/redis-native.yml'

permissions:
  contents: read

jobs:
  protocol:
    name: Redis RESP2 contracts (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24, 26]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
      - run: npm run test:redis

  live:
    name: live Redis ${{ matrix.redis }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        redis: ['7.4', '8.2']
    services:
      redis:
        image: redis:${{ matrix.redis }}
        ports:
          - 6379:6379
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=30
    env:
      REDIS_HOST: 127.0.0.1
      REDIS_PORT: 6379
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - run: node lib/dialects/redis/test/live.js
