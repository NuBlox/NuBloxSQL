# Free public-repository security static analysis; not a penetration test,
# independent certification or commercial approval. Monitor alerts separately.
name: MySQL driver CodeQL security analysis

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  schedule:
    - cron: '43 4 * * 3'

permissions:
  contents: read

jobs:
  codeql:
    name: codeql-javascript-typescript
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      actions: read
      security-events: write
    steps:
      - name: Checkout exact reviewed source
        uses: actions/checkout@v4
      - name: Initialise native-driver JS/TS static security analysis
        uses: github/codeql-action/init@v4
        with:
          languages: javascript-typescript
          queries: security-extended
      - name: Analyse and publish security findings
        uses: github/codeql-action/analyze@v4
        with:
          category: '/language:javascript-typescript'
