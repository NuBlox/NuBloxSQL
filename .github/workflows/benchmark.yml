name: NuBloxSQL competitor benchmark

on:
  workflow_dispatch:
    inputs:
      iterations:
        description: Measured query iterations per client
        required: false
        default: '1000'
      warmup:
        description: Warm-up iterations per client
        required: false
        default: '100'

permissions:
  contents: read

jobs:
  mysql2-query:
    name: mysql2 sequential query comparison
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: nublox_root_password
          MYSQL_DATABASE: nublox_benchmark
          MYSQL_USER: nublox
          MYSQL_PASSWORD: nublox_benchmark_password
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h localhost -uroot -pnublox_root_password --silent"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=30
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: package.json

      - name: Install dependencies
        run: npm install --ignore-scripts

      - name: Run mysql2 comparison
        env:
          MYSQL_HOST: 127.0.0.1
          MYSQL_PORT: 3306
          MYSQL_USER: nublox
          MYSQL_PASSWORD: nublox_benchmark_password
          MYSQL_DATABASE: nublox_benchmark
          BENCHMARK_ITERATIONS: ${{ inputs.iterations }}
          BENCHMARK_WARMUP: ${{ inputs.warmup }}
        run: npm run benchmark:mysql2
