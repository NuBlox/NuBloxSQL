# Temporary branch-only lockfile bootstrap; remove before merge.
# The repository currently has no lockfile and a cloud npm registry is
# required to generate integrity hashes; the builder never publishes packages.
name: Bootstrap exact npm workspace lockfile
on:
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  bootstrap:
    if: ${{ github.event.pull_request.head.repo.full_name == 'NuBlox/NuBloxSQL' && github.event.pull_request.head.ref == 'build/reproducible-workspace-install-20261031' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: build/reproducible-workspace-install-20261031
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Resolve exact workspace dependency graph without lifecycle hooks
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund
      - name: Independently install graph from generated lock
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Commit generated integrity-checked lock to this branch only
        shell: bash
        run: |
          set -euo pipefail
          git add package-lock.json
          git diff --cached --quiet && exit 0
          git -c user.name='github-actions[bot]' \
            -c user.email='41898282+github-actions[bot]@users.noreply.github.com' \
            commit -m 'build: resolve and lock audited driver workspace toolchain'
          git push origin HEAD:refs/heads/build/reproducible-workspace-install-20261031
