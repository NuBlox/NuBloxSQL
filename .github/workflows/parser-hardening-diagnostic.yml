name: Parser hardening diagnostic

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  unit-family:
    name: Unit family ${{ matrix.filter }}
    runs-on: ubuntu-latest
    timeout-minutes: 3
    strategy:
      fail-fast: false
      matrix:
        filter:
          - unit/protocol
          - unit/connection
          - unit/query
          - unit/pool/
          - unit/pool-cluster
          - unit/test-
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: package.json

      - name: Install dependencies
        run: npm install --ignore-scripts

      - name: Run isolated unit family
        env:
          FILTER: ${{ matrix.filter }}
        run: node test/run.js
